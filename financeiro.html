<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rastreando GPS — Financeiro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f4f8;--bg2:#fff;--bg3:#f0f0f5;
  --txt:#1a1a2e;--txt2:#6b7280;--txt3:#9ca3af;
  --border:#e5e7eb;--purple:#26215C;--purple2:#3C3489;
  --green:#0F6E56;--red:#A32D2D;--amber:#854F0B;--blue:#185FA5;
  --green-bg:#EAF3DE;--red-bg:#FCEBEB;--amber-bg:#FAEEDA;--blue-bg:#E6F1FB;
  --radius:12px;--radius-sm:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);min-height:100vh;color:var(--txt)}
.app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:80px}
.topbar{background:var(--purple);padding:20px 20px 16px;position:sticky;top:0;z-index:10}
.topbar-row{display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:17px;font-weight:600;color:#fff}
.topbar p{font-size:12px;color:rgba(255,255,255,.55);margin-top:2px}
.badge-sync{font-size:11px;background:rgba(255,255,255,.15);color:rgba(255,255,255,.85);padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:4px}
.tab-bar{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:68px;z-index:9}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:11px;color:var(--txt2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab.active{color:var(--purple);border-bottom:2px solid var(--purple);font-weight:600}
.tab i{display:block;font-size:18px;margin-bottom:2px}
.screen{display:none;padding:16px}
.screen.active{display:block}
.section-label{font-size:11px;font-weight:600;color:var(--txt3);letter-spacing:.07em;text-transform:uppercase;margin:0 0 10px 2px}
.card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);padding:16px;margin-bottom:14px}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.metric{background:var(--bg2);border-radius:var(--radius-sm);padding:14px;border:1px solid var(--border)}
.metric-label{font-size:11px;color:var(--txt2);margin-bottom:5px}
.metric-value{font-size:21px;font-weight:700;color:var(--txt)}
.metric-value.green{color:var(--green)}
.metric-value.red{color:var(--red)}
.metric-value.amber{color:var(--amber)}
.saldo-card{background:linear-gradient(135deg,#26215C 0%,#3C3489 100%);border-radius:var(--radius);padding:22px;margin-bottom:14px;position:relative;overflow:hidden}
.saldo-card::after{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;background:rgba(255,255,255,.05);border-radius:50%}
.saldo-label{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:6px}
.saldo-value{font-size:34px;font-weight:700;color:#fff;letter-spacing:-.5px}
.saldo-sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:6px}
.saldo-refresh{position:absolute;top:18px;right:18px;color:rgba(255,255,255,.45);font-size:20px;cursor:pointer;z-index:1}

/* CLASSE CARD */
.classe-bloco{border-bottom:1px solid var(--border);padding:11px 0}
.classe-bloco:last-child{border-bottom:none}
.classe-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.classe-left{display:flex;align-items:center;gap:10px}
.classe-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.classe-info p{font-size:14px;font-weight:600;color:var(--txt)}
.classe-info span{font-size:11px;color:var(--txt2)}
/* VALORES INVERTIDOS */
.classe-valor{text-align:right}
.receber-label{font-size:10px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px}
.receber-principal{font-size:15px;font-weight:700;line-height:1.15}
.receber-principal.receber-pos{color:var(--green)}
.receber-principal.receber-neg{color:var(--blue)}
.total-label{font-size:10px;color:var(--txt3);margin-top:5px}
.total-secundario{font-size:12px;font-weight:500;color:var(--txt2)}
.classe-chevron{font-size:14px;color:var(--txt3);transition:transform .2s;margin-left:6px;flex-shrink:0}
.classe-chevron.open{transform:rotate(180deg)}
.pct-row{display:flex;align-items:center;gap:6px;margin-top:5px;margin-bottom:2px}
.pct-track{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.pct-fill{height:100%;border-radius:3px}
.pct-lbl{font-size:11px;font-weight:600;min-width:38px;text-align:right}
/* SANFONA CLASSES */
.classe-devedores{display:none;margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.classe-devedores.open{display:block}
.devedor-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.devedor-item:last-child{border-bottom:none}
.devedor-left{display:flex;align-items:center;gap:8px}
.devedor-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.devedor-avatar.av-red{background:var(--red-bg);border:1.5px solid #E24B4A;color:var(--red)}
.devedor-avatar.av-blue{background:var(--blue-bg);border:1.5px solid #4A90D9;color:var(--blue)}
.devedor-avatar.av-purple{background:#EEEDFE;border:1.5px solid #7B6FDE;color:var(--purple2)}
.devedor-nome{font-size:13px;font-weight:600;color:var(--txt)}
.devedor-tel{font-size:11px;color:var(--txt2)}
.devedor-right{text-align:right}
.devedor-valor{font-size:13px;font-weight:700}
.devedor-valor.v-red{color:var(--red)}
.devedor-valor.v-blue{color:var(--blue)}
.devedor-valor.v-purple{color:var(--purple2)}
.devedor-venc{font-size:10px;color:var(--txt3);margin-top:2px}
.devedor-wa{display:inline-flex;align-items:center;gap:3px;margin-top:4px;background:#25d366;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;cursor:pointer;border:none;font-family:inherit}
.classe-devedores-vazio{font-size:12px;color:var(--txt3);padding:8px 0;font-style:italic}

/* STATUS */
.tag{font-size:11px;padding:4px 9px;border-radius:20px;font-weight:600}
.tag.green{background:var(--green-bg);color:var(--green)}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.amber{background:var(--amber-bg);color:var(--amber)}
.tag.blue{background:var(--blue-bg);color:var(--blue)}
.tag.purple{background:#EEEDFE;color:var(--purple2)}
.status-row{display:flex;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.status-row:last-child{border-bottom:none}
.status-right p{font-size:14px;font-weight:600;color:var(--txt)}
.cf-hint{font-size:10px;color:var(--txt3);margin-top:3px;font-style:italic}

/* SANFONA STATUS (CF e IN) */
.status-sanfona-trigger{cursor:pointer;user-select:none;width:100%}
.status-sanfona-header{display:flex;justify-content:space-between;align-items:center;width:100%}
.status-sanfona-left{display:flex;flex-direction:column;gap:2px}
.status-sanfona-chevron{font-size:14px;color:var(--txt3);transition:transform .2s;flex-shrink:0;margin-left:6px}
.status-sanfona-chevron.open{transform:rotate(180deg)}
.status-sanfona-body{display:none;margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.status-sanfona-body.open{display:block}
.status-sanfona-loading{font-size:12px;color:var(--txt3);padding:6px 0;font-style:italic}

.spacer{height:8px}
/* DESPESAS */
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg-btn{flex:1;padding:9px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--txt2);transition:all .15s}
.seg-btn.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--bg3);border-radius:var(--radius-sm);margin-bottom:8px}
.summary-row span{font-size:12px;color:var(--txt2)}
.summary-row strong{font-size:15px;font-weight:700;color:var(--txt)}
.desp-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.desp-item:last-child{border-bottom:none}
.desp-left{display:flex;align-items:center;gap:10px}
.desp-icon{width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.desp-name{font-size:14px;font-weight:600;color:var(--txt)}
.desp-sub{font-size:11px;color:var(--txt2)}
.desp-right{text-align:right}
.desp-valor{font-size:14px;font-weight:700;color:var(--txt)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.dot.g{background:#1D9E75}.dot.r{background:#E24B4A}
/* PROJEÇÃO */
.proj-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.proj-row:last-child{border-bottom:none}
.proj-label{font-size:13px;font-weight:500;color:var(--txt)}
.proj-sub{font-size:11px;color:var(--txt2)}
.proj-value{font-size:14px;font-weight:700}
.bar-item{margin-bottom:12px}
.bar-header{display:flex;justify-content:space-between;font-size:12px;color:var(--txt2);margin-bottom:5px}
.bar-track{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.tip{font-size:12px;color:var(--txt2);background:var(--bg3);padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:14px;line-height:1.6}
/* FAB / MODAL */
.fab{position:fixed;bottom:88px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--purple);color:#fff;display:none;align-items:center;justify-content:center;font-size:24px;cursor:pointer;z-index:20}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;padding:24px 20px 32px;width:100%;max-width:430px}
.modal h2{font-size:17px;font-weight:700;margin-bottom:18px;color:var(--txt)}
.fg{margin-bottom:14px}
.fg label{font-size:12px;color:var(--txt2);display:block;margin-bottom:5px;font-weight:500}
.fg input,.fg select{width:100%;padding:11px 13px;border-radius:var(--radius-sm);border:1px solid var(--border);font-size:14px;background:var(--bg);color:var(--txt);outline:none}
.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn-save{width:100%;padding:14px;background:var(--purple);color:#fff;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;border:none;margin-top:6px}
.btn-cancel{width:100%;padding:12px;background:transparent;color:var(--txt2);border-radius:var(--radius-sm);font-size:14px;cursor:pointer;border:1px solid var(--border);margin-top:8px}
.loading{text-align:center;padding:40px 20px;color:var(--txt2)}
.loading i{font-size:32px;color:var(--purple2);animation:spin 1s linear infinite;display:block;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.erro-msg{background:var(--red-bg);color:var(--red);padding:12px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;line-height:1.5}
/* HISTÓRICO */
.hist-mes-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);padding:16px;margin-bottom:12px;cursor:pointer;transition:border-color .15s}
.hist-mes-card:hover{border-color:var(--purple2)}
.hist-mes-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hist-mes-titulo{font-size:15px;font-weight:700;color:var(--txt)}
.hist-mes-data{font-size:11px;color:var(--txt3)}
.hist-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hist-metric{background:var(--bg3);border-radius:var(--radius-sm);padding:10px}
.hist-metric-label{font-size:10px;color:var(--txt2);margin-bottom:3px}
.hist-metric-value{font-size:14px;font-weight:700;color:var(--txt)}
.hist-detalhe{display:none;margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.hist-detalhe.open{display:block}
.hist-section{font-size:11px;font-weight:600;color:var(--txt3);letter-spacing:.06em;text-transform:uppercase;margin:10px 0 6px}
.hist-linha{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--border)}
.hist-linha:last-child{border-bottom:none}
.empty-hist{text-align:center;padding:40px 20px;color:var(--txt3)}
.empty-hist i{font-size:40px;display:block;margin-bottom:10px}
</style>

<div class="app">
  <div class="topbar">
    <div class="topbar-row">
      <div><h1>Rastreando GPS</h1><p id="sub-data">Carregando...</p></div>
      <span class="badge-sync"><i class="ti ti-refresh" style="font-size:12px"></i> Ao vivo</span>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab active" onclick="showTab('dashboard',this)"><i class="ti ti-layout-dashboard"></i>Dashboard</div>
    <div class="tab" onclick="showTab('despesas',this)"><i class="ti ti-wallet"></i>Despesas</div>
    <div class="tab" onclick="showTab('projecao',this)"><i class="ti ti-chart-line"></i>Projeção</div>
    <div class="tab" onclick="showTab('historico',this)"><i class="ti ti-clock-hour-4"></i>Histórico</div>
  </div>

  <div class="screen active" id="screen-dashboard">
    <div id="dash-content"><div class="loading"><i class="ti ti-loader"></i>Buscando dados...</div></div>
  </div>

  <div class="screen" id="screen-despesas">
    <div style="height:14px"></div>
    <div class="seg">
      <button class="seg-btn active" onclick="switchDesp('empresa',this)">Empresa</button>
      <button class="seg-btn" onclick="switchDesp('pessoal',this)">Pessoal</button>
    </div>
    <div id="desp-empresa"><div class="loading"><i class="ti ti-loader"></i>Carregando...</div></div>
    <div id="desp-pessoal" style="display:none"><div class="loading"><i class="ti ti-loader"></i>Carregando...</div></div>
  </div>

  <div class="screen" id="screen-projecao">
    <div id="proj-content"><div class="loading"><i class="ti ti-loader"></i>Calculando...</div></div>
  </div>

  <div class="screen" id="screen-historico">
    <div style="height:14px"></div>
    <div id="hist-content"><div class="loading"><i class="ti ti-loader"></i>Carregando histórico...</div></div>
  </div>
</div>

<div class="fab" id="fab" onclick="abrirModal()"><i class="ti ti-plus"></i></div>

<div class="overlay" id="modal" onclick="fecharModalFora(event)">
  <div class="modal">
    <h2>Nova despesa</h2>
    <div class="form-row">
      <div class="fg"><label>Tipo</label><select id="f-tipo"><option>Empresa</option><option>Pessoal</option></select></div>
      <div class="fg"><label>Categoria</label><select id="f-cat"><option>Fixa</option><option>Variável</option></select></div>
    </div>
    <div class="fg"><label>Nome</label><input type="text" id="f-nome" placeholder="Ex: Aluguel, Fornecedor..."></div>
    <div class="form-row">
      <div class="fg"><label>Valor (R$)</label><input type="number" id="f-valor" placeholder="0,00" step="0.01"></div>
      <div class="fg"><label>Status</label><select id="f-status"><option value="PG">Pago</option><option value="AB">Em aberto</option></select></div>
    </div>
    <div id="modal-erro" style="display:none" class="erro-msg"></div>
    <button class="btn-save" onclick="salvarDespesa()">Salvar despesa</button>
    <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script>
const API_URL    = 'https://script.google.com/macros/s/AKfycbytcNWXoxhFawEn4t7emSqMBCKmaPSKDnoxfhZWFKI6If0I_EVoDtVdeT5gaVCGnwda/exec';
const API_SECRET = 'rastreandogps2025';
const STORAGE_KEY = 'rgps_historico';

const brl = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = v => Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) + '%';

async function buscar(action) {
  const res = await fetch(API_URL + '?secret=' + API_SECRET + '&action=' + action);
  return res.json();
}

// ── FECHAMENTO MENSAL ────────────────────────
async function verificarFechamentoMensal() {
  const hoje = new Date();
  if (hoje.getDate() !== 1) return;
  const chave = 'rgps_fechado_' + hoje.getFullYear() + '_' + hoje.getMonth();
  if (localStorage.getItem(chave)) return;
  try {
    const [dash, desp, proj] = await Promise.all([buscar('dashboard'),buscar('despesas'),buscar('projecao')]);
    if (dash.error || desp.error || proj.error) return;
    const mesAnt = new Date(hoje.getFullYear(), hoje.getMonth()-1, 1);
    const nomeMes = mesAnt.toLocaleString('pt-BR',{month:'long',year:'numeric'});
    const snap = { mes: nomeMes, fechadoEm: new Date().toISOString(), dashboard: dash, despesas: desp, projecao: proj };
    const hist = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
    hist.unshift(snap);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(hist));
    localStorage.setItem(chave,'1');
  } catch(e){}
}

// ── CACHE DOS CLIENTES CF/IN ─────────────────
let cacheStatusClientes = null;

async function garantirStatusClientes() {
  if (cacheStatusClientes) return cacheStatusClientes;
  try {
    const d = await buscar('statusClientes');
    cacheStatusClientes = d.error ? { cf: [], inn: [] } : { cf: d.cf||[], inn: d.inn||[] };
  } catch(e) {
    cacheStatusClientes = { cf: [], inn: [] };
  }
  return cacheStatusClientes;
}

// ── SANFONA CF / IN ──────────────────────────
async function toggleStatusSanfona(tipo) {
  const bodyEl = document.getElementById('ssanf-body-' + tipo);
  const chevEl = document.getElementById('ssanf-chev-' + tipo);
  const isOpen = bodyEl.classList.contains('open');

  if (isOpen) {
    bodyEl.classList.remove('open');
    chevEl.classList.remove('open');
    return;
  }

  bodyEl.classList.add('open');
  chevEl.classList.add('open');

  // Só carrega uma vez (lazy)
  if (bodyEl.dataset.loaded === '1') return;
  bodyEl.dataset.loaded = '1';
  bodyEl.innerHTML = '<div class="status-sanfona-loading"><i class="ti ti-loader" style="animation:spin 1s linear infinite;margin-right:4px"></i>Carregando...</div>';

  const dados = await garantirStatusClientes();
  const lista = tipo === 'cf' ? dados.cf : dados.inn;
  const avClass  = tipo === 'cf' ? 'av-blue'   : 'av-purple';
  const valClass = tipo === 'cf' ? 'v-blue'     : 'v-purple';

  if (!lista || lista.length === 0) {
    bodyEl.innerHTML = '<div class="classe-devedores-vazio">Nenhum cliente nesta situação 🎉</div>';
    return;
  }

  bodyEl.innerHTML = lista.map(d => {
    const ini = d.nome.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
    const telFmt = d.telefone ? d.telefone.replace(/(\d{2})(\d{4,5})(\d{4})/, '($1) $2-$3') : '';
    const waLink = d.telefone ? 'https://wa.me/55' + d.telefone : '#';
    return '<div class="devedor-item">' +
      '<div class="devedor-left">' +
        '<div class="devedor-avatar ' + avClass + '">' + ini + '</div>' +
        '<div><div class="devedor-nome">' + d.nome + '</div>' +
        '<div class="devedor-tel">' + telFmt + '</div></div>' +
      '</div>' +
      '<div class="devedor-right">' +
        '<div class="devedor-valor ' + valClass + '">R$ ' + d.valor + '</div>' +
        '<div class="devedor-venc">' + d.venc + '</div>' +
        (d.telefone ? '<a href="' + waLink + '" target="_blank"><button class="devedor-wa"><i class="ti ti-brand-whatsapp" style="font-size:11px"></i> WhatsApp</button></a>' : '') +
      '</div>' +
    '</div>';
  }).join('');
}

// ── DASHBOARD ────────────────────────────────
let dadosInadClasse = null;

async function carregarDashboard() {
  // Limpa cache ao recarregar
  cacheStatusClientes = null;
  try {
    const [d, inad] = await Promise.all([buscar('dashboard'), buscar('inadimplentesClasse')]);
    if (d.error) { document.getElementById('dash-content').innerHTML='<div class="erro-msg">'+d.error+'</div>'; return; }
    dadosInadClasse = inad.error ? {ouro:[],prata:[],latao:[]} : inad;

    document.getElementById('sub-data').textContent = 'Atualizado às ' + d.atualizadoAs + ' · ' + d.mes;

    const pgPct = d.classes.ouro.clientes  > 0 ? (d.classes.ouro.pg  / d.classes.ouro.clientes  * 100) : 0;
    const prPct = d.classes.prata.clientes > 0 ? (d.classes.prata.pg / d.classes.prata.clientes * 100) : 0;
    const ltPct = d.classes.latao.clientes > 0 ? (d.classes.latao.pg / d.classes.latao.clientes * 100) : 0;

    document.getElementById('dash-content').innerHTML =
      '<div style="height:14px"></div>' +

      '</div>' +
      '<div class="metric-grid">' +

        classeBloco('prata', '🥈', 'Prata', '#E6F1FB', d.classes.prata, prPct, '#378ADD', '#185FA5', dadosInadClasse.prata) +
        classeBloco('latao', '🚩', 'Latão', '#FCEBEB', d.classes.latao, ltPct, '#E24B4A', '#A32D2D', dadosInadClasse.latao) +
      '</div>' +

        statusHtml('green',  '🟢 PG ' + d.status.PG.qnt, brl(d.status.PG.valor)) +

      '</div>';
  } catch(e) {

  }

function classeBloco(id, emoji, nome, bgIcon, c, pgPct, barColor, pctColor, devedores) {
  const devedoresHtml = devedores && devedores.length > 0
    ? devedores.map(d => {
        const ini = d.nome.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
        const telFmt = d.telefone ? d.telefone.replace(/(\d{2})(\d{4,5})(\d{4})/,'($1) $2-$3') : '';
        const waLink = d.telefone ? 'https://wa.me/55' + d.telefone : '#';
        return '<div class="devedor-item">' +
          '<div class="devedor-left">' +
            '<div class="devedor-avatar av-red">' + ini + '</div>' +
            '<div><div class="devedor-nome">' + d.nome + '</div>' +
            '<div class="devedor-tel">' + telFmt + '</div></div>' +
          '</div>' +
          '<div class="devedor-right">' +
            '<div class="devedor-valor v-red">R$ ' + d.valor + '</div>' +
            '<div class="devedor-venc">' + d.venc + '</div>' +
            (d.telefone ? '<a href="' + waLink + '" target="_blank"><button class="devedor-wa"><i class="ti ti-brand-whatsapp" style="font-size:11px"></i> WhatsApp</button></a>' : '') +
          '</div>' +
        '</div>';
      }).join('')
    : '<div class="classe-devedores-vazio">Nenhum inadimplente nesta classe 🎉</div>';

  const qtdInad = devedores ? devedores.length : 0;
  const labelInad = qtdInad > 0
    ? '<span style="font-size:10px;background:var(--red-bg);color:var(--red);padding:2px 7px;border-radius:20px;font-weight:700;margin-left:6px">' + qtdInad + ' em atraso</span>'
    : '';

  const receber = Number(c.receber || 0);
  let valorPrincipalHtml;
  if (receber >= 0) {
    valorPrincipalHtml =
      '<div class="receber-label">A receber</div>' +
      '<div class="receber-principal receber-pos">' + brl(receber) + '</div>';
  } else {
    valorPrincipalHtml =
      '<div class="receber-label">Superávit de</div>' +
      '<div class="receber-principal receber-neg">' + brl(Math.abs(receber)) + '</div>';
  }

  return '<div class="classe-bloco">' +
    '<div class="classe-header" onclick="toggleClasse(\'' + id + '\')">' +
      '<div class="classe-left">' +
        '<div class="classe-icon" style="background:' + bgIcon + '">' + emoji + '</div>' +
        '<div class="classe-info"><p>' + nome + labelInad + '</p><span>' + c.clientes + ' clientes · ' + c.faltam + ' faltam</span></div>' +
      '</div>' +
      '<div style="display:flex;align-items:center">' +
        '<div class="classe-valor">' +
          valorPrincipalHtml +
          '<div class="total-label">Total</div>' +
          '<div class="total-secundario">' + brl(c.total) + '</div>' +
        '</div>' +
        '<i class="ti ti-chevron-down classe-chevron" id="chev-' + id + '"></i>' +
      '</div>' +
    '</div>' +
    '<div class="pct-row">' +
      '<div class="pct-track"><div class="pct-fill" style="width:' + pgPct.toFixed(1) + '%;background:' + barColor + '"></div></div>' +
      '<span class="pct-lbl" style="color:' + pctColor + '">' + pgPct.toFixed(1) + '%</span>' +
    '</div>' +
    '<div class="classe-devedores" id="dev-' + id + '">' + devedoresHtml + '</div>' +
  '</div>';
}

function toggleClasse(id) {
  const el = document.getElementById('dev-' + id);
  const ch = document.getElementById('chev-' + id);
  el.classList.toggle('open');
  ch.classList.toggle('open');
}

const iconMap={default:{i:'ti-circle-dot',c:'#EEEDFE',t:'#534AB7'},aluguel:{i:'ti-home',c:'#E1F5EE',t:'#0F6E56'},seguro:{i:'ti-shield',c:'#E6F1FB',t:'#185FA5'},luz:{i:'ti-bolt',c:'#FAEEDA',t:'#854F0B'},internet:{i:'ti-wifi',c:'#EEEDFE',t:'#534AB7'},academia:{i:'ti-barbell',c:'#FAECE7',t:'#993C1D'},telefone:{i:'ti-phone',c:'#E6F1FB',t:'#185FA5'},contador:{i:'ti-calculator',c:'#E6F1FB',t:'#185FA5'},imposto:{i:'ti-file-invoice',c:'#FAEEDA',t:'#854F0B'},ipva:{i:'ti-car',c:'#E1F5EE',t:'#0F6E56'},das:{i:'ti-receipt-tax',c:'#FAECE7',t:'#993C1D'},plataforma:{i:'ti-server',c:'#FAECE7',t:'#993C1D'},beatriz:{i:'ti-user-circle',c:'#FBEAF0',t:'#993556'},mercado:{i:'ti-credit-card',c:'#E6F1FB',t:'#185FA5'},arquia:{i:'ti-building-bank',c:'#EEEDFE',t:'#534AB7'},smart:{i:'ti-sim',c:'#E1F5EE',t:'#0F6E56'},transmeet:{i:'ti-video',c:'#E6F1FB',t:'#185FA5'},click:{i:'ti-pen',c:'#EEEDFE',t:'#534AB7'},zap:{i:'ti-brand-whatsapp',c:'#E1F5EE',t:'#0F6E56'},prolabore:{i:'ti-user',c:'#EEEDFE',t:'#534AB7'},casas:{i:'ti-shopping-cart',c:'#FBEAF0',t:'#993556'}};
function getIcone(nome){const n=nome.toLowerCase();for(const[k,v]of Object.entries(iconMap)){if(n.includes(k))return v;}return iconMap.default;}

function renderDespesas(itens,containerId,total,pago){
  const aberto=total-pago;
  document.getElementById(containerId).innerHTML=
    '<div class="summary-row"><span>Total fixo</span><strong>'+brl(total)+'</strong></div>'+
    '<div class="summary-row" style="margin-bottom:16px"><span>Pago</span><strong style="color:var(--green)">'+brl(pago)+'</strong></div>'+
    (aberto>0?'<div class="summary-row" style="margin-bottom:16px"><span>Em aberto</span><strong style="color:var(--red)">'+brl(aberto)+'</strong></div>':'')+
    '<p class="section-label">Itens</p>'+
    '<div class="card" style="padding:4px 16px">'+
    itens.map(d=>{const ic=getIcone(d.nome);return'<div class="desp-item"><div class="desp-left"><div class="desp-icon" style="background:'+ic.c+'"><i class="ti '+ic.i+'" style="font-size:17px;color:'+ic.t+'"></i></div><div><div class="desp-name">'+d.nome+'</div><div class="desp-sub">'+(d.status==='AB'?'Em aberto':'')+'</div></div></div><div class="desp-right"><div class="desp-valor">'+brl(d.valor)+'</div><div style="font-size:11px;color:var(--txt2)"><span class="dot '+(d.status==='PG'?'g':'r')+'"></span>'+(d.status==='PG'?'Pago':'Em aberto')+'</div></div></div>';}).join('')+
    '</div>';
}

async function carregarDespesas(){
  try{
    const d=await buscar('despesas');
    if(d.error){document.getElementById('desp-empresa').innerHTML='<div class="erro-msg">'+d.error+'</div>';return;}
    renderDespesas(d.empresa.itens,'desp-empresa',d.empresa.total,d.empresa.pago);
    renderDespesas(d.pessoal.itens,'desp-pessoal',d.pessoal.total,d.pessoal.pago);
  }catch(e){document.getElementById('desp-empresa').innerHTML='<div class="erro-msg">Erro ao carregar despesas.</div>';}
}

    const maxRec=Math.max(d.classes.ouro.esperado,d.classes.prata.esperado,d.classes.latao.esperado);
    const bp=(label,val,max,cor)=>{const w=max>0?Math.round((val/max)*100):0;return'<div class="bar-item"><div class="bar-header"><span>'+label+'</span><span>'+brl(val)+'</span></div><div class="bar-track"><div class="bar-fill" style="width:'+w+'%;background:'+cor+'"></div></div></div>';};
    document.getElementById('proj-content').innerHTML=
      '<div style="height:14px"></div>'+
      '<div class="tip">Projeção baseada na confiabilidade histórica de cada classe de cliente.</div>'+
      '<div class="metric-grid">'+
        '<div class="metric"><div class="metric-label">Receita provável</div><div class="metric-value green">'+brl(d.receitaProvavel)+'</div></div>'+
        '<div class="metric"><div class="metric-label">Despesas totais</div><div class="metric-value red">'+brl(d.totalDespesas)+'</div></div>'+
        '<div class="metric"><div class="metric-label">Margem estimada</div><div class="metric-value '+(d.margemEstimada>=0?'green':'red')+'">'+brl(d.margemEstimada)+'</div></div>'+
        '<div class="metric"><div class="metric-label">Pró-labore</div><div class="metric-value amber">'+brl(d.prolabore)+'</div></div>'+
      '</div>'+
      '<p class="section-label">Receita esperada por classe</p>'+
      '<div class="card">'+bp('🥇 Ouro ('+d.classes.ouro.percentual+'%)',d.classes.ouro.esperado,maxRec,'#EF9F27')+bp('🥈 Prata ('+d.classes.prata.percentual+'%)',d.classes.prata.esperado,maxRec,'#378ADD')+bp('🚩 Latão ('+d.classes.latao.percentual+'%)',d.classes.latao.esperado,maxRec,'#E24B4A')+'</div>'+
      '<p class="section-label">Fluxo estimado do mês</p>'+
      '<div class="card">'+
        '<div class="proj-row"><div><div class="proj-label">Receita confirmada</div><div class="proj-sub">Clientes PG + CF</div></div><div class="proj-value" style="color:var(--green)">+'+brl(d.receitaConfirmada)+'</div></div>'+
        '<div class="proj-row"><div><div class="proj-label">Despesas empresa</div></div><div class="proj-value" style="color:var(--red)">-'+brl(d.despesasEmpresa)+'</div></div>'+
        '<div class="proj-row"><div><div class="proj-label">Despesas pessoais</div></div><div class="proj-value" style="color:var(--red)">-'+brl(d.despesasPessoal)+'</div></div>'+
        '<div class="proj-row"><div><div class="proj-label">Pró-labore</div></div><div class="proj-value" style="color:var(--red)">-'+brl(d.prolabore)+'</div></div>'+
        '<div class="proj-row" style="border-top:2px solid var(--border);margin-top:4px;padding-top:14px"><div><div class="proj-label" style="font-weight:700;font-size:15px">Resultado líquido</div></div><div class="proj-value" style="color:'+(d.margemEstimada>=0?'var(--green)':'var(--red)')+';font-size:17px">'+(d.margemEstimada>=0?'+':'')+brl(d.margemEstimada)+'</div></div>'+
      '</div>';
  }catch(e){document.getElementById('proj-content').innerHTML='<div class="erro-msg">Erro ao calcular projeção.</div>';}
}

// ── HISTÓRICO ────────────────────────────────
function carregarHistorico(){
  const hist=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  const el=document.getElementById('hist-content');
  if(hist.length===0){el.innerHTML='<div class="empty-hist"><i class="ti ti-calendar-off"></i><p>Nenhum mês fechado ainda.</p><p style="font-size:12px;margin-top:6px">No dia 1 de cada mês o app salva automaticamente o mês anterior aqui.</p></div>';return;}
  el.innerHTML=hist.map((snap,idx)=>{
    const d=snap.dashboard,p=snap.projecao;
    const dataFecho=new Date(snap.fechadoEm).toLocaleDateString('pt-BR');
    return'<div class="hist-mes-card" onclick="toggleDetalhe('+idx+')">'+
      '<div class="hist-mes-header"><div class="hist-mes-titulo">'+snap.mes.charAt(0).toUpperCase()+snap.mes.slice(1)+'</div>'+
      '<div style="display:flex;align-items:center;gap:8px"><span class="hist-mes-data">Fechado em '+dataFecho+'</span><i class="ti ti-chevron-down" id="chevron-'+idx+'" style="font-size:16px;color:var(--txt3);transition:transform .2s"></i></div></div>'+
      '<div class="hist-metrics">'+
        '<div class="hist-metric"><div class="hist-metric-label">Recebido</div><div class="hist-metric-value" style="color:var(--green)">'+brl(d.recebido)+'</div></div>'+
        '<div class="hist-metric"><div class="hist-metric-label">Fat. esperado</div><div class="hist-metric-value">'+brl(d.fatEsperado)+'</div></div>'+
        '<div class="hist-metric"><div class="hist-metric-label">Inadimplência</div><div class="hist-metric-value" style="color:var(--red)">'+pct(d.inadimplencia)+'</div></div>'+
        '<div class="hist-metric"><div class="hist-metric-label">Resultado líquido</div><div class="hist-metric-value" style="color:'+(p.margemEstimada>=0?'var(--green)':'var(--red)')+'">'+brl(p.margemEstimada)+'</div></div>'+
      '</div>'+
      '<div class="hist-detalhe" id="detalhe-'+idx+'">'+
        '<div class="hist-section">Classes</div>'+
        '<div class="hist-linha"><span>🥇 Ouro</span><span>'+brl(d.classes.ouro.total)+'</span></div>'+
        '<div class="hist-linha"><span>🥈 Prata</span><span>'+brl(d.classes.prata.total)+'</span></div>'+
        '<div class="hist-linha"><span>🚩 Latão</span><span>'+brl(d.classes.latao.total)+'</span></div>'+
        '<div class="hist-section">Despesas</div>'+
        '<div class="hist-linha"><span>Empresa</span><span style="color:var(--red)">'+brl(p.despesasEmpresa)+'</span></div>'+
        '<div class="hist-linha"><span>Pessoal</span><span style="color:var(--red)">'+brl(p.despesasPessoal)+'</span></div>'+
        '<div class="hist-linha"><span>Pró-labore</span><span style="color:var(--red)">'+brl(p.prolabore)+'</span></div>'+
        '<div class="hist-section">Status</div>'+
        '<div class="hist-linha"><span>🟢 PG</span><span>'+brl(d.status.PG.valor)+'</span></div>'+
        '<div class="hist-linha"><span>🔴 AT</span><span>'+brl(d.status.AT.valor)+'</span></div>'+
        '<div class="hist-linha"><span>🔘 MP</span><span>'+brl(d.status.MP.valor)+'</span></div>'+
      '</div>'+
    '</div>';
  }).join('');
}
function toggleDetalhe(idx){
  const el=document.getElementById('detalhe-'+idx),ch=document.getElementById('chevron-'+idx);
  el.classList.toggle('open');
  ch.style.transform=el.classList.contains('open')?'rotate(180deg)':'';

// ── SALVAR DESPESA ───────────────────────────
async function salvarDespesa(){
  const nome=document.getElementById('f-nome').value.trim();
  const valor=parseFloat(document.getElementById('f-valor').value);
  const status=document.getElementById('f-status').value;
  const tipo=document.getElementById('f-tipo').value;
  const erroEl=document.getElementById('modal-erro');
  if(!nome||isNaN(valor)||valor<=0){erroEl.textContent='Preencha o nome e o valor.';erroEl.style.display='block';return;}
  erroEl.style.display='none';
  try{
    const res=await fetch(API_URL,{method:'POST',body:JSON.stringify({secret:API_SECRET,action:'salvarDespesa',tipo,nome,valor,status})});
    const json=await res.json();
    if(json.ok){fecharModal();document.getElementById('f-nome').value='';document.getElementById('f-valor').value='';carregarDespesas();}
    else{erroEl.textContent=json.error||'Erro ao salvar.';erroEl.style.display='block';}
  }catch(e){erroEl.textContent='Erro de conexão.';erroEl.style.display='block';}
}

// ── NAVEGAÇÃO ────────────────────────────────
let despCarregada=false,projCarregada=false,histCarregada=false;
function showTab(id,el){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  el.classList.add('active');
  document.getElementById('fab').style.display=id==='despesas'?'flex':'none';
  if(id==='despesas'&&!despCarregada){carregarDespesas();despCarregada=true;}
  if(id==='projecao'&&!projCarregada){carregarProjecao();projCarregada=true;}
  if(id==='historico'&&!histCarregada){carregarHistorico();histCarregada=true;}
}
function switchDesp(tipo,btn){
  document.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('desp-empresa').style.display=tipo==='empresa'?'block':'none';
  document.getElementById('desp-pessoal').style.display=tipo==='pessoal'?'block':'none';
}
function abrirModal(){document.getElementById('modal').classList.add('open')}
function fecharModal(){document.getElementById('modal').classList.remove('open')}
function fecharModalFora(e){if(e.target===document.getElementById('modal'))fecharModal()}

verificarFechamentoMensal();
carregarDashboard();
