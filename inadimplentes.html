inadimplentes.html

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rastreando GPS — Inadimplentes</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B3A6B">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;font-family:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fa;color:#1b2d47}
body{display:flex;flex-direction:column;overflow-x:hidden}
header{background:#fff;border-bottom:1px solid #e0e6ed;padding:14px 16px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
.header-content{display:flex;align-items:center;gap:12px}
.header-brand{font-size:16px;font-weight:700;color:#1b2d47}
.header-sub{font-size:13px;color:#6b7c99}
.header-btn{margin-left:auto;background:none;border:none;color:#6b7c99;cursor:pointer;font-size:13px;font-weight:600;padding:8px 12px;border-radius:6px;transition:all .2s}
.header-btn:hover{background:#f0f3f7;color:#1b2d47}
main{flex:1;overflow-y:auto;padding:0}
.card{background:#fff;border-radius:10px;border:1px solid #e0e6ed;padding:16px}
.login-container{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:12px;border:1px solid #e0e6ed;padding:28px;box-shadow:0 1px 3px rgba(27,45,71,.08)}
.login-card h2{font-size:22px;font-weight:700;margin-bottom:8px;color:#1b2d47}
.login-card p{font-size:14px;color:#6b7c99;margin-bottom:24px}
.field{margin-bottom:16px;display:flex;flex-direction:column}
.field label{font-size:13px;font-weight:600;color:#1b2d47;margin-bottom:6px}
.field input{padding:11px 13px;border:1px solid #dce1e8;border-radius:8px;font-size:15px;font-family:inherit;color:#1b2d47;transition:border-color .2s}
.field input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.1)}
.field input::placeholder{color:#9ca3af}
.erro-txt{font-size:13px;color:#d32f2f;margin-top:6px;display:none}
.btn{padding:11px 16px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-pri{background:#2563eb;color:#fff;width:100%;margin-top:4px}
.btn-pri:hover{background:#1d4ed8}
.btn-pri:disabled{opacity:.6;cursor:default}
.tabs{display:flex;border-bottom:1px solid #e0e6ed;background:#fff;gap:0;position:sticky;top:57px;z-index:40}
.tab-btn{flex:1;padding:14px 12px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;color:#6b7c99;border-bottom:2px solid transparent;transition:all .2s;text-align:center}
.tab-btn.ativo{color:#2563eb;border-bottom-color:#2563eb}
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;background:#f5f7fa}
.res-card{background:#fff;border-radius:8px;border:1px solid #e0e6ed;padding:12px;text-align:center}
.res-card b{display:block;font-size:20px;font-weight:700;color:#1b2d47;margin-bottom:4px}
.res-card span{display:block;font-size:12px;color:#6b7c99;font-weight:500}
.lista-clientes{max-height:calc(100vh - 280px);overflow-y:auto;padding:8px}
.cliente-card{background:#fff;border-radius:10px;border:1px solid #e0e6ed;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.cliente-info h3{font-size:14px;font-weight:600;color:#1b2d47;margin-bottom:3px}
.cliente-info p{font-size:12px;color:#6b7c99}
.cliente-valor{font-size:15px;font-weight:700;color:#d32f2f;text-align:right}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(37,99,235,.3);border-top-color:#2563eb;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.toolbar{display:flex;gap:8px;padding:12px;background:#f5f7fa;flex-wrap:wrap}
.toolbar input{flex:1;min-width:200px;padding:9px 12px;border:1px solid #dce1e8;border-radius:8px;font-size:13px;font-family:inherit}
.toolbar input:focus{outline:none;border-color:#2563eb}
.toolbar select{padding:9px 12px;border:1px solid #dce1e8;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer}
.toolbar select:focus{outline:none;border-color:#2563eb}
.msg-editor{margin:12px;padding:12px;background:#f5f7fa;border-radius:8px;cursor:pointer}
.msg-editor summary{font-weight:600;color:#2563eb;user-select:none;padding:8px}
.msg-editor summary:hover{color:#1d4ed8}
.msg-editor textarea{width:100%;padding:10px 12px;border:1px solid #dce1e8;border-radius:8px;font-family:inherit;font-size:13px;resize:vertical;min-height:100px;margin-top:12px;color:#1b2d47}
.msg-editor textarea:focus{outline:none;border-color:#2563eb}
.var-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.var-chips button{padding:6px 10px;background:#fff;border:1px solid #dce1e8;border-radius:6px;font-size:12px;cursor:pointer;transition:all .2s}
.var-chips button:hover{border-color:#2563eb;background:#f0f3f7}
.aba-retornos{padding:12px}
.retorno-card{background:#fff;border-radius:10px;border:1px solid #e0e6ed;padding:12px;margin-bottom:10px}
.retorno-card h4{font-size:13px;font-weight:600;color:#1b2d47;margin-bottom:6px}
.retorno-card p{font-size:12px;color:#6b7c99;line-height:1.5}
.btn-sair{background:#f0f3f7;color:#6b7c99}
.btn-sair:hover{background:#e0e6ed}
.toast{position:fixed;bottom:20px;left:20px;background:#1b2d47;color:#fff;padding:12px 16px;border-radius:8px;font-size:13px;z-index:999;display:none}
.toast.mostrar{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.esc{white-space:pre-wrap;word-break:break-word}
details{margin:0}
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div>
      <div class="header-brand">Rastreando GPS</div>
      <div class="header-sub">Inadimplentes · uso interno</div>
    </div>
  </div>
  <button type="button" class="header-btn btn-sair hidden" id="btn-logout">Sair</button>
</header>

<!-- TELA DE LOGIN -->
<section id="tela-login" class="login-container">
  <div class="login-card">
    <h2>Entrar</h2>
    <p>Use suas credenciais para acessar</p>
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="username" placeholder="seu@email.com">
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" placeholder="••••••••">
      <div class="erro-txt" id="login-erro"></div>
    </div>
    <button type="button" class="btn btn-pri" id="btn-entrar">Entrar</button>
  </div>
</section>

<!-- TELA DE LISTA -->
<section id="tela-lista" hidden class="main">
  <div class="tabs">
    <button type="button" data-tab="dois" class="tab-btn ativo">2+ meses <span id="cnt-dois"></span></button>
    <button type="button" data-tab="um" class="tab-btn">1 boleto <span id="cnt-um"></span></button>
    <button type="button" data-tab="retornos" class="tab-btn">📅 Retornos <span id="cnt-retornos"></span></button>
  </div>

  <div class="resumo" id="resumo-clientes">
    <div class="res-card"><b id="res-qtd">0</b><span>clientes</span></div>
    <div class="res-card"><b id="res-valor">R$ 0</b><span>em aberto</span></div>
  </div>

  <details class="msg-editor" id="editor-dois">
    <summary>✏️ Mensagem para quem deve 2+ meses</summary>
    <textarea id="tpl-dois"></textarea>
    <div class="var-chips" data-alvo="tpl-dois">
      <button type="button" data-v="{primeiro_nome}">{primeiro_nome}</button>
      <button type="button" data-v="{nome}">{nome}</button>
      <button type="button" data-v="{valor_total}">{valor_total}</button>
      <button type="button" data-v="{qtd_boletos}">{qtd_boletos}</button>
      <button type="button" data-v="{dias_atraso}">{dias_atraso}</button>
      <button type="button" data-v="{link_regularizar}">{link_regularizar}</button>
    </div>
  </details>
  <details class="msg-editor" id="editor-um">
    <summary>✏️ Mensagem para quem deve 1 boleto</summary>
    <textarea id="tpl-um"></textarea>
    <div class="var-chips" data-alvo="tpl-um">
      <button type="button" data-v="{primeiro_nome}">{primeiro_nome}</button>
      <button type="button" data-v="{nome}">{nome}</button>
      <button type="button" data-v="{valor_total}">{valor_total}</button>
      <button type="button" data-v="{qtd_boletos}">{qtd_boletos}</button>
      <button type="button" data-v="{dias_atraso}">{dias_atraso}</button>
      <button type="button" data-v="{link_boleto}">{link_boleto}</button>
    </div>
  </details>

  <div class="toolbar" id="toolbar-clientes">
    <input type="text" id="busca" placeholder="Buscar por nome ou CPF...">
    <select id="ordenar">
      <option value="valor">Maior valor</option>
      <option value="dias">Mais atrasado</option>
      <option value="nome">Nome (A-Z)</option>
    </select>
    <button type="button" id="btn-atualizar" class="btn btn-pri" style="flex:none">🔄 Atualizar</button>
  </div>

  <div class="lista-clientes" id="lista-clientes"></div>

  <div class="aba-retornos hidden" id="aba-retornos"></div>
</section>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

// ===== CONFIGURAÇÃO FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyDkQSOOt9fIZVr2r6nEK0oo4w3HTg2E2I8",
  authDomain: "rastreando-assinaturas.firebaseapp.com",
  projectId: "rastreando-assinaturas",
  storageBucket: "rastreando-assinaturas.firebasestorage.app",
  messagingSenderId: "706454638603",
  appId: "1:706454638603:web:f48eda23a2ca50e6b4f70e"
};
// ================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const fns = getFunctions(app, "southamerica-east1");
const fnListar = httpsCallable(fns, "inadimplentes");

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s || '').replace(/[&<>"]/g, m => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
}[m]));
const brl = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
const primeiroNome = (n) => String(n || '').trim().split(/\s+/)[0] || '';

let DADOS = [];
let abaAtual = 'dois';

// ===== AUTENTICAÇÃO =====
onAuthStateChanged(auth, (usuario) => {
  const estaLogado = !!usuario;
  $('tela-login').hidden = estaLogado;
  $('tela-lista').hidden = !estaLogado;
  $('btn-logout').classList.toggle('hidden', !estaLogado);
  if (estaLogado) carregarDados();
});

$('btn-entrar').addEventListener('click', async () => {
  const email = $('email').value.trim();
  const senha = $('senha').value;
  if (!email || !senha) {
    mostrarErroLogin('Preencha e-mail e senha');
    return;
  }
  $('btn-entrar').disabled = true;
  $('btn-entrar').innerHTML = '<span class="spin"></span>';
  $('login-erro').style.display = 'none';
  try {
    await signInWithEmailAndPassword(auth, email, senha);
  } catch (e) {
    mostrarErroLogin('E-mail ou senha incorretos');
  }
  $('btn-entrar').disabled = false;
  $('btn-entrar').innerHTML = 'Entrar';
});

$('senha').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') $('btn-entrar').click();
});

$('btn-logout').addEventListener('click', () => signOut(auth));

function mostrarErroLogin(msg) {
  $('login-erro').textContent = msg;
  $('login-erro').style.display = 'block';
}

// ===== DADOS =====
async function carregarDados() {
  try {
    const r = await fnListar({ acao: 'listar' });
    DADOS = r || [];
    carregarTemplates();
    renderLista();
  } catch (e) {
    toast((e && e.message) || 'Erro ao carregar dados', 'erro');
  }
}

function carregarTemplates() {
  const a = localStorage.getItem('inad_tpl_dois') || 'Olá, {primeiro_nome}! Identificamos {qtd_boletos} faturas vencidas, totalizando {valor_total}. Regularize agora: {link_regularizar}';
  const b = localStorage.getItem('inad_tpl_um') || 'Olá, {primeiro_nome}! Consta uma fatura vencida no valor de {valor_total}. Pague agora: {link_boleto}';
  $('tpl-dois').value = a;
  $('tpl-um').value = b;
}

$('tpl-dois').addEventListener('input', function() {
  try { localStorage.setItem('inad_tpl_dois', this.value); } catch (e) {}
});
$('tpl-um').addEventListener('input', function() {
  try { localStorage.setItem('inad_tpl_um', this.value); } catch (e) {}
});

document.querySelectorAll('.var-chips').forEach(grupo => {
  grupo.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', function() {
      const alvo = $(grupo.getAttribute('data-alvo'));
      const ini = alvo.selectionStart || alvo.value.length;
      const fim = alvo.selectionEnd || alvo.value.length;
      alvo.value = alvo.value.slice(0, ini) + b.getAttribute('data-v') + alvo.value.slice(fim);
      alvo.dispatchEvent(new Event('input'));
      alvo.focus();
    });
  });
});

// ===== ABAS =====
document.querySelectorAll('.tab-btn').forEach(b => {
  b.addEventListener('click', function() {
    abaAtual = b.getAttribute('data-tab');
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.toggle('ativo', x === b));
    $('editor-dois').style.display = abaAtual === 'dois' ? '' : 'none';
    $('editor-um').style.display = abaAtual === 'um' ? '' : 'none';
    $('toolbar-clientes').style.display = abaAtual === 'retornos' ? 'none' : '';
    $('resumo-clientes').style.display = abaAtual === 'retornos' ? 'none' : '';
    $('lista-clientes').hidden = abaAtual === 'retornos';
    $('aba-retornos').hidden = abaAtual !== 'retornos';
    if (abaAtual === 'retornos') renderRetornos(); else renderLista();
  });
});
$('editor-um').style.display = 'none';

$('busca').addEventListener('input', renderLista);
$('ordenar').addEventListener('change', renderLista);

$('btn-atualizar').addEventListener('click', async function() {
  this.disabled = true;
  this.innerHTML = '<span class="spin"></span>';
  try {
    const r = await fnListar({ acao: 'listar' });
    DADOS = r || [];
    renderLista();
    toast('Atualizado', 'ok');
  } catch (e) {
    toast((e && e.message) || 'Erro ao atualizar', 'erro');
  }
  this.disabled = false;
  this.innerHTML = '🔄 Atualizar';
});

// ===== RENDER =====
function renderLista() {
  const busca = $('busca').value.toLowerCase();
  const ordem = $('ordenar').value;
  let filtrados = DADOS.filter(c => {
    const nome = String(c.nome || '').toLowerCase();
    const cpf = String(c.cpf || '').toLowerCase();
    return nome.includes(busca) || cpf.includes(busca);
  });
  if (ordem === 'valor') filtrados.sort((a, b) => (b.total || 0) - (a.total || 0));
  else if (ordem === 'dias') filtrados.sort((a, b) => (b.diasAtraso || 0) - (a.diasAtraso || 0));
  else if (ordem === 'nome') filtrados.sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));

  const dois = filtrados.filter(c => abaAtual === 'dois' && (c.diasAtraso || 0) > 60);
  const um = filtrados.filter(c => abaAtual === 'um' && (c.diasAtraso || 0) <= 60);

  $('cnt-dois').textContent = `(${DADOS.filter(c => (c.diasAtraso || 0) > 60).length})`;
  $('cnt-um').textContent = `(${DADOS.filter(c => (c.diasAtraso || 0) <= 60).length})`;
  $('cnt-retornos').textContent = `(${DADOS.filter(c => c.promessa).length})`;

  const mostrar = abaAtual === 'dois' ? dois : um;
  const qtd = mostrar.length;
  const total = mostrar.reduce((s, c) => s + (c.total || 0), 0);

  $('res-qtd').textContent = qtd;
  $('res-valor').textContent = brl(total);

  let html = '';
  for (const c of mostrar) {
    html += `<div class="cliente-card">
      <div class="cliente-info">
        <h3>${esc(c.nome)}</h3>
        <p>${esc(c.cpf)} · ${c.qtdBoletos || 0} boleto(s)</p>
      </div>
      <div class="cliente-valor">${brl(c.total || 0)}</div>
    </div>`;
  }
  $('lista-clientes').innerHTML = html || '<p style="padding:16px;color:#6b7c99;text-align:center">Nenhum cliente encontrado</p>';
}

function renderRetornos() {
  const promessas = DADOS.filter(c => c.promessa);
  let html = '';
  for (const c of promessas) {
    html += `<div class="retorno-card">
      <h4>${esc(c.nome)}</h4>
      <p><strong>Promessa:</strong> ${esc(c.promessa)}</p>
      <p><strong>Data:</strong> ${esc(c.dataPromessa)}</p>
    </div>`;
  }
  $('aba-retornos').innerHTML = html || '<p style="padding:16px;color:#6b7c99">Sem retornos registrados</p>';
}

function toast(msg, tipo) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast mostrar ' + (tipo || '');
  setTimeout(() => { t.className = 'toast'; }, 2500);
}
</script>
</body>
</html>
