<style>
:root {
  --bg: #0a0e14;
  --bg-card: #141a24;
  --bg-card2: #1a212d;
  --bg-card3: #1e2738;
  --cyan: #00e5ff;
  --cyan-dim: #00b8cc;
  --text: #e8eaed;
  --text-dim: #8b96a5;
  --text-muted: #4a5568;
  --green: #00c853;
  --yellow: #ffb300;
  --blue: #1e88e5;
  --red: #e8002d;
  --border: #232c38;
  --border2: #2d3748;
  --pending: #ffb300;
  --done: #1e88e5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}

/* ── LOGIN ── */
#loginScreen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding:24px;z-index:100;
}
.login-box{width:100%;max-width:340px}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo h1{font-size:22px;font-weight:800;letter-spacing:.3px}
.login-logo h1 span{color:var(--cyan)}
.login-logo p{color:var(--text-dim);font-size:13px;margin-top:6px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.login-field input{
  width:100%;background:var(--bg-card);border:1px solid var(--border2);
  color:var(--text);padding:14px 16px;border-radius:12px;
  font-size:16px;outline:none;transition:border-color .2s;
}
.login-field input:focus{border-color:var(--cyan)}
.btn-login{
  width:100%;background:var(--cyan);color:#04222a;
  border:none;border-radius:12px;padding:15px;
  font-size:16px;font-weight:800;margin-top:8px;
  cursor:pointer;transition:opacity .15s,transform .15s;
}
.btn-login:active{transform:scale(.98);opacity:.9}
#loginErr{color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:18px}

/* ── MAIN LAYOUT ── */
#app{display:none;height:100%;flex-direction:column}
#app.visible{display:flex}

.topbar{
  padding:12px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);flex-shrink:0;
  background:var(--bg);
}
.topbar-left h2{font-size:15px;font-weight:700}
.topbar-left h2 span{color:var(--cyan)}
.topbar-left p{font-size:12px;color:var(--text-dim);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:10px}
.sync-dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--green);box-shadow:0 0 6px var(--green);
  transition:background .3s,box-shadow .3s;
}
.sync-dot.syncing{background:var(--yellow);box-shadow:0 0 6px var(--yellow);animation:pulse 1s infinite}
.sync-dot.error{background:var(--red);box-shadow:0 0 6px var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn-logout{
  font-size:11px;color:var(--text-dim);cursor:pointer;
  background:var(--bg-card);border:1px solid var(--border2);
  padding:4px 10px;border-radius:8px;
}

/* tab nav */
.tabnav{
  display:flex;border-bottom:1px solid var(--border);flex-shrink:0;
  background:var(--bg);
}
.tabnav button{
  flex:1;padding:11px 4px;background:none;border:none;
  color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;
  border-bottom:2px solid transparent;transition:color .2s,border-color .2s;
}
.tabnav button.active{color:var(--cyan);border-bottom-color:var(--cyan)}

/* swipe container */
.swipe-wrap{flex:1;display:flex;overflow:hidden;position:relative}
.swipe-pane{
  min-width:100%;height:100%;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}

/* ── CALENDÁRIO ── */
.cal-wrap{padding:16px}
.cal-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.cal-month{font-size:16px;font-weight:700}
.cal-nav button{
  background:var(--bg-card2);border:1px solid var(--border2);
  color:var(--text);width:34px;height:34px;border-radius:10px;
  font-size:16px;cursor:pointer;
}
.cal-nav{display:flex;gap:6px}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{
  text-align:center;font-size:10px;font-weight:700;
  color:var(--text-muted);text-transform:uppercase;padding:4px 0 8px;
}
.cal-day{
  border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  padding:6px 2px 5px;
  cursor:pointer;transition:background .15s,transform .1s;
  position:relative;min-height:46px;
}
.cal-day:active{transform:scale(.93)}
.cal-day.empty-cell{background:none!important;pointer-events:none}
.cal-day.other-month{color:var(--text-muted)}
.cal-day.today .cal-num{
  background:var(--cyan);color:#04222a;
  border-radius:50%;width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;
}
.cal-day.selected{background:rgba(0,229,255,.15)!important;border:1px solid rgba(0,229,255,.4)}
.cal-day.selected .cal-num{color:var(--cyan);font-weight:800}
.cal-day.has-os .cal-num{font-weight:800}
.cal-num{
  font-size:13px;font-weight:500;line-height:1;
  display:flex;align-items:center;justify-content:center;
  min-width:24px;min-height:24px;
}
.cal-day .dot-row{
  display:flex;gap:3px;margin-top:4px;
  flex-wrap:wrap;justify-content:center;max-width:90%;
}
.cal-day .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-pending{background:var(--pending)}
.dot-done{background:var(--done)}

.cal-day-detail{
  background:var(--bg-card);border:1px solid rgba(0,229,255,.2);
  border-radius:14px;padding:14px;margin-top:14px;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.cal-day-detail-header{
  display:flex;align-items:center;gap:8px;margin-bottom:12px;
}
.cal-day-detail-header h3{font-size:13px;color:var(--cyan);font-weight:700;flex:1}
.cal-day-detail-close{
  font-size:18px;color:var(--text-muted);cursor:pointer;
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;background:var(--bg-card2);
}
.no-os-msg{text-align:center;color:var(--text-dim);font-size:13px;padding:20px 0}

/* ── PAINEL ── */
.painel-wrap{padding:12px 16px}
.painel-filter{
  display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;
}
.filter-btn{
  padding:6px 14px;border-radius:20px;border:1px solid var(--border2);
  background:var(--bg-card);color:var(--text-dim);font-size:12px;
  font-weight:600;cursor:pointer;transition:all .15s;
}
.filter-btn.active{background:var(--cyan);color:#04222a;border-color:var(--cyan)}

.os-card{
  background:var(--bg-card);border:1px solid var(--border2);
  border-radius:14px;margin-bottom:12px;overflow:hidden;
  transition:box-shadow .2s;
}
.os-card.status-pendente{border-left:4px solid var(--pending)}
.os-card.status-feito{border-left:4px solid var(--done)}

.os-card-header{
  padding:12px 14px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;
}
.os-card-title{flex:1;min-width:0}
.os-nome{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.os-meta{font-size:11px;color:var(--text-dim);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.os-status-badge{
  font-size:10px;font-weight:800;padding:3px 8px;
  border-radius:20px;white-space:nowrap;flex-shrink:0;text-transform:uppercase;letter-spacing:.4px;
}
.badge-pendente{background:rgba(255,179,0,.15);color:var(--pending)}
.badge-feito{background:rgba(30,136,229,.15);color:var(--done)}

.os-card-body{
  padding:0 14px;max-height:0;overflow:hidden;
  transition:max-height .3s ease,padding .3s;
}
.os-card-body.open{max-height:500px;padding:0 14px 14px}

.os-detail-row{
  display:flex;align-items:flex-start;gap:8px;
  padding:7px 0;border-bottom:1px solid var(--border);
}
.os-detail-row:last-child{border-bottom:none}
.os-detail-icon{font-size:15px;flex-shrink:0;width:22px;text-align:center;margin-top:1px}
.os-detail-text{flex:1;min-width:0}
.os-detail-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px}
.os-detail-value{font-size:13px;color:var(--text);margin-top:1px;word-break:break-word}

.os-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.os-btn{
  flex:1;min-width:0;padding:10px 8px;border-radius:10px;border:none;
  font-size:12px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:opacity .15s,transform .15s;white-space:nowrap;
}
.os-btn:active{transform:scale(.97);opacity:.85}
.btn-wpp{background:rgba(0,200,83,.15);color:var(--green);border:1px solid rgba(0,200,83,.3)}
.btn-maps{background:rgba(0,229,255,.1);color:var(--cyan);border:1px solid rgba(0,229,255,.2)}
.btn-contato{
  background:rgba(30,136,229,.15);color:var(--blue);
  border:1px solid rgba(30,136,229,.3);width:100%;flex:none;
}
.btn-contato.done{background:rgba(0,200,83,.1);color:var(--green);border-color:rgba(0,200,83,.3)}

.contato-info{
  font-size:11px;color:var(--text-dim);margin-top:8px;text-align:center;
}

/* ── MODAL OS MANUAL ── */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  display:none;align-items:flex-end;justify-content:center;
  z-index:200;padding:0;
}
.modal-bg.open{display:flex}
.modal-sheet{
  background:var(--bg-card);border-radius:20px 20px 0 0;
  width:100%;max-width:520px;padding:20px 20px 32px;
  max-height:90vh;overflow-y:auto;
}
.modal-handle{
  width:40px;height:4px;background:var(--border2);
  border-radius:2px;margin:0 auto 20px;
}
.modal-title{font-size:16px;font-weight:800;margin-bottom:16px;color:var(--cyan)}
.mfield{margin-bottom:12px}
.mfield label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.mfield input,.mfield select{
  width:100%;background:var(--bg-card2);border:1px solid var(--border2);
  color:var(--text);padding:12px 14px;border-radius:10px;
  font-size:14px;outline:none;transition:border-color .2s;
}
.mfield input:focus,.mfield select:focus{border-color:var(--cyan)}
.mfield select option{background:var(--bg-card)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-modal-save{
  width:100%;background:var(--cyan);color:#04222a;border:none;
  border-radius:12px;padding:14px;font-size:15px;font-weight:800;
  margin-top:8px;cursor:pointer;transition:opacity .15s;
}
.btn-modal-cancel{
  width:100%;background:none;color:var(--text-dim);border:1px solid var(--border2);
  border-radius:12px;padding:12px;font-size:14px;font-weight:600;
  margin-top:8px;cursor:pointer;
}

.fab{
  position:fixed;bottom:24px;right:20px;
  width:54px;height:54px;border-radius:27px;
  background:var(--cyan);color:#04222a;border:none;
  font-size:26px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 20px rgba(0,229,255,.35);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s;z-index:50;
}
.fab:active{transform:scale(.93);box-shadow:0 2px 10px rgba(0,229,255,.2)}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:80px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--bg-card2);border:1px solid var(--border);
  color:var(--text);padding:11px 18px;border-radius:10px;
  font-size:13px;opacity:0;transition:opacity .25s,transform .25s;
  pointer-events:none;z-index:300;max-width:90%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--green)}
.toast.fail{border-color:var(--red)}

.empty-state{
  text-align:center;padding:40px 20px;color:var(--text-dim);font-size:14px;
}
.empty-state .icon{font-size:36px;margin-bottom:10px}
</style>
</head>
<body>

<!-- ═══════════════ LOGIN ═══════════════ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <h1>Rastreando <span>GPS</span></h1>
      <p>Área do Técnico</p>
    </div>
    <div class="login-field">
      <label>Usuário</label>
      <input type="text" id="loginUser" placeholder="Seu nome" autocomplete="off" autocapitalize="words">
    </div>
    <div class="login-field">
      <label>Senha</label>
      <input type="password" id="loginPass" placeholder="••••••" inputmode="numeric">
    </div>
    <button class="btn-login" id="btnLogin">Entrar</button>
    <div id="loginErr"></div>
  </div>
</div>

<!-- ═══════════════ APP ═══════════════ -->
<div id="app">

  <div class="topbar">
    <div class="topbar-left">
      <h2>Rastreando <span>GPS</span></h2>
      <p id="topbarUser">Técnico</p>
    </div>
    <div class="topbar-right">
      <div class="sync-dot" id="syncDot"></div>
      <div class="btn-logout" id="btnLogout">Sair</div>
    </div>
  </div>

  <div class="tabnav">
    <button class="active" id="tabCal" onclick="switchTab(0)">📅 Calendário</button>
    <button id="tabPainel" onclick="switchTab(1)">📋 Painel</button>
  </div>

  <div class="swipe-wrap" id="swipeWrap">

    <!-- CALENDÁRIO -->
    <div class="swipe-pane" id="paneCalendario">
      <div class="cal-wrap">
        <div class="cal-header">
          <div class="cal-month" id="calMonth">—</div>
          <div class="cal-nav">
            <button onclick="moveMonth(-1)">‹</button>
            <button onclick="moveMonth(1)">›</button>
          </div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div id="calDetail"></div>
      </div>
    </div>

    <!-- PAINEL -->
    <div class="swipe-pane" id="panePainel">
      <div class="painel-wrap">
        <div class="painel-filter">
          <button class="filter-btn active" onclick="setFilter('todos',this)">Todos</button>
          <button class="filter-btn" onclick="setFilter('pendente',this)">⏳ Pendentes</button>
          <button class="filter-btn" onclick="setFilter('contato_realizado',this)">✅ Feitos</button>
        </div>
        <div id="painelLista"></div>
      </div>
    </div>

  </div><!-- /swipe-wrap -->

</div><!-- /app -->

<!-- FAB -->
<button class="fab" id="fabAdd" title="Nova OS">＋</button>

<!-- MODAL OS MANUAL -->
<div class="modal-bg" id="modalOS">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">📋 Nova Ordem de Serviço</div>

    <div class="row2">
      <div class="mfield">
        <label>Data</label>
        <input type="date" id="mData">
      </div>
      <div class="mfield">
        <label>Hora</label>
        <input type="time" id="mHora">
      </div>
    </div>
    <div class="mfield">
      <label>Nome do cliente</label>
      <input type="text" id="mNome" placeholder="Nome completo" autocapitalize="words">
    </div>
    <div class="mfield">
      <label>Telefone / WhatsApp</label>
      <input type="tel" id="mTel" placeholder="(21) 9 9999-9999">
    </div>
    <div class="mfield">
      <label>Endereço</label>
      <input type="text" id="mEnd" placeholder="Rua, número, bairro, cidade">
    </div>
    <div class="mfield">
      <label>Ponto de referência</label>
      <input type="text" id="mRef" placeholder="Opcional">
    </div>
    <div class="mfield">
      <label>Veículo (modelo e ano)</label>
      <input type="text" id="mVeiculo" placeholder="Ex: HB20 (2022)">
    </div>
    <div class="row2">
      <div class="mfield">
        <label>GNV</label>
        <select id="mGnv">
          <option value="Não">Não</option>
          <option value="Sim">Sim</option>
        </select>
      </div>
      <div class="mfield">
        <label>Rastreio</label>
        <select id="mRastreio">
          <option value="Com bloqueio">Com bloqueio</option>
          <option value="Sem bloqueio">Sem bloqueio</option>
        </select>
      </div>
    </div>

    <button class="btn-modal-save" id="btnSaveOS">✅ Salvar OS</button>
    <button class="btn-modal-cancel" id="btnCancelOS">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════
// CONFIG — substitua pela URL do seu Apps Script
// ══════════════════════════════════════════════════════════
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwDk2FER9rlbsJXxufDVhTUWDdMG_GIfAy8zKy2tE7VMbNOCwz7deEV1KhJL8xGOng/exec';
const POLL_MS = 30000;

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
let session = { tecnico: '', senha: '' };
let osList = [];
let calDate = new Date();
let selectedDay = null;
let filterStatus = 'todos';
let currentTab = 0;
let pollTimer = null;

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
(function init() {
  const saved = localStorage.getItem('rg_session');
  if (saved) {
    try {
      session = JSON.parse(saved);
      startApp();
    } catch(e) { showLogin(); }
  } else { showLogin(); }

  setupSwipe();
  setupModal();

  document.getElementById('btnLogin').addEventListener('click', doLogin);
  document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  document.getElementById('btnLogout').addEventListener('click', doLogout);
})();

function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').classList.remove('visible');
  document.getElementById('fabAdd').style.display = 'none';
}

function startApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  document.getElementById('fabAdd').style.display = 'flex';
  document.getElementById('topbarUser').textContent = session.tecnico;
  loadOS();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(loadOS, POLL_MS);
}

// ══════════════════════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════════════════════
async function doLogin() {
  const usuario = document.getElementById('loginUser').value.trim();
  const senha   = document.getElementById('loginPass').value.trim();
  const errEl   = document.getElementById('loginErr');
  errEl.textContent = '';

  if (!usuario || !senha) { errEl.textContent = 'Preencha usuário e senha.'; return; }

  document.getElementById('btnLogin').textContent = 'Entrando...';
  document.getElementById('btnLogin').disabled = true;

  try {
    const res = await fetch(`${GAS_URL}?action=login&usuario=${encodeURIComponent(usuario)}&senha=${encodeURIComponent(senha)}`);
    const data = await res.json();
    if (data.erro) throw new Error(data.erro);
    if (data.tipo !== 'tecnico') throw new Error('Use o app admin para administradores.');

    session = { tecnico: data.tecnico, senha: senha };
    localStorage.setItem('rg_session', JSON.stringify(session));
    startApp();
  } catch(err) {
    errEl.textContent = err.message || 'Erro ao conectar.';
  } finally {
    document.getElementById('btnLogin').textContent = 'Entrar';
    document.getElementById('btnLogin').disabled = false;
  }
}

function doLogout() {
  if(!confirm('Sair da conta?')) return;
  localStorage.removeItem('rg_session');
  if(pollTimer) clearInterval(pollTimer);
  osList = [];
  session = { tecnico:'', senha:'' };
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  showLogin();
}

// ══════════════════════════════════════════════════════════
// SYNC
// ══════════════════════════════════════════════════════════
function setSyncStatus(st) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot' + (st==='syncing'?' syncing':st==='error'?' error':'');
}

async function loadOS() {
  setSyncStatus('syncing');
  try {
    const res = await fetch(`${GAS_URL}?action=getOS&tecnico=${encodeURIComponent(session.tecnico)}&senha=${encodeURIComponent(session.senha)}`);
    const data = await res.json();
    if (data.erro) throw new Error(data.erro);
    osList = data.os || [];
    renderCalendario();
    renderPainel();
    setSyncStatus('ok');
  } catch(err) {
    console.error(err);
    setSyncStatus('error');
  }
}

// ══════════════════════════════════════════════════════════
// CALENDÁRIO
// ══════════════════════════════════════════════════════════
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS_SEMANA = ['D','S','T','Q','Q','S','S'];

function renderCalendario() {
  const year  = calDate.getFullYear();
  const month = calDate.getMonth();
  document.getElementById('calMonth').textContent = `${MESES[month]} ${year}`;

  const firstDay   = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date();

  const grid = document.getElementById('calGrid');

  // cabeçalho dias da semana
  let html = DIAS_SEMANA.map(d=>`<div class="cal-dow">${d}</div>`).join('');

  // células vazias antes do dia 1
  for(let i=0;i<firstDay;i++) html += `<div class="cal-day empty-cell"></div>`;

  for(let d=1;d<=daysInMonth;d++) {
    const dateStr = `${String(d).padStart(2,'0')}/${String(month+1).padStart(2,'0')}/${year}`;
    const dayOS   = osList.filter(o => o.data_agendada === dateStr);
    const isToday = (d===today.getDate() && month===today.getMonth() && year===today.getFullYear());
    const isSel   = (selectedDay === dateStr);

    let cls = 'cal-day';
    if(isToday)      cls += ' today';
    if(dayOS.length) cls += ' has-os';
    if(isSel)        cls += ' selected';

    // máximo 3 bolinhas visíveis para não estourar
    const dotsToShow = dayOS.slice(0, 4);
    const dots = dotsToShow.map(o => {
      const dotCls = o.status === 'contato_realizado' ? 'dot dot-done' : 'dot dot-pending';
      return `<div class="${dotCls}"></div>`;
    }).join('');

    html += `
      <div class="${cls}" onclick="selectDay('${dateStr}')">
        <div class="cal-num">${d}</div>
        ${dayOS.length ? `<div class="dot-row">${dots}</div>` : ''}
      </div>`;
  }

  grid.innerHTML = html;
  renderCalDetail();
}

function selectDay(dateStr) {
  // toggle: clica no mesmo dia fecha o detalhe
  selectedDay = (selectedDay === dateStr) ? null : dateStr;
  renderCalendario();
  // rola até o detalhe se abriu
  if(selectedDay) {
    setTimeout(()=>{
      const det = document.getElementById('calDetail');
      if(det) det.scrollIntoView({behavior:'smooth', block:'nearest'});
    }, 50);
  }
}

function renderCalDetail() {
  const det = document.getElementById('calDetail');
  if (!selectedDay) { det.innerHTML=''; return; }

  const dayOS = osList.filter(o => o.data_agendada === selectedDay);

  if (!dayOS.length) {
    det.innerHTML = `
      <div class="cal-day-detail">
        <div class="cal-day-detail-header">
          <h3>📅 ${selectedDay}</h3>
          <div class="cal-day-detail-close" onclick="selectDay('${selectedDay}')">✕</div>
        </div>
        <div class="no-os-msg">Nenhuma OS agendada neste dia.</div>
      </div>`;
    return;
  }

  det.innerHTML = `
    <div class="cal-day-detail">
      <div class="cal-day-detail-header">
        <h3>📅 ${selectedDay} · ${dayOS.length} OS</h3>
        <div class="cal-day-detail-close" onclick="selectDay('${selectedDay}')">✕</div>
      </div>
      ${dayOS.map(o => osCardHTML(o, false)).join('')}
    </div>`;

  bindOSActions(det, dayOS);
}

function moveMonth(dir) {
  calDate = new Date(calDate.getFullYear(), calDate.getMonth()+dir, 1);
  selectedDay = null;
  renderCalendario();
}

// ══════════════════════════════════════════════════════════
// PAINEL
// ══════════════════════════════════════════════════════════
function setFilter(f, btn) {
  filterStatus = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderPainel();
}

function renderPainel() {
  const lista = document.getElementById('painelLista');
  let filtered = osList;
  if (filterStatus !== 'todos') filtered = osList.filter(o => o.status === filterStatus);

  if (!filtered.length) {
    lista.innerHTML = `<div class="empty-state"><div class="icon">📭</div>Nenhuma OS encontrada.</div>`;
    return;
  }

  // ordena por data desc
  filtered = [...filtered].sort((a,b) => {
    const da = parseDate(a.data_agendada);
    const db = parseDate(b.data_agendada);
    return db - da;
  });

  lista.innerHTML = filtered.map(o => osCardHTML(o, false)).join('');
  bindOSActions(lista, filtered);
}

// ══════════════════════════════════════════════════════════
// OS CARD HTML
// ══════════════════════════════════════════════════════════
function osCardHTML(os, compact) {
  const isPendente = os.status !== 'contato_realizado';
  const statusCls  = isPendente ? 'status-pendente' : 'status-feito';
  const badgeCls   = isPendente ? 'badge-pendente' : 'badge-feito';
  const badgeTxt   = isPendente ? '⏳ Pendente' : '✅ Feito';

  const tel = sanitizeTel(os.cliente_telefone);
  const wppURL = tel ? `https://wa.me/55${tel}?text=Ol%C3%A1%20${encodeURIComponent(os.cliente_nome)}%2C%20sou%20t%C3%A9cnico%20da%20Rastreando%20GPS!` : '';
  const mapsURL = os.endereco ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(os.endereco)}` : '';

  const contatoInfo = os.data_contato
    ? `<div class="contato-info">Contato: ${os.data_contato} às ${os.hora_contato}</div>`
    : '';

  return `
  <div class="os-card ${statusCls}" id="card-${os.id}">
    <div class="os-card-header" onclick="toggleCard('${os.id}')">
      <div class="os-card-title">
        <div class="os-nome">${esc(os.cliente_nome) || 'Sem nome'}</div>
        <div class="os-meta">
          <span>📅 ${os.data_agendada || '—'}${os.hora_agendada?' às '+os.hora_agendada:''}</span>
          <span>🚗 ${esc(os.veiculo) || '—'}</span>
          <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px">📍 ${esc(os.endereco) || '—'}</span>
        </div>
      </div>
      <div class="os-status-badge ${badgeCls}">${badgeTxt}</div>
    </div>
    <div class="os-card-body" id="body-${os.id}">
      <div class="os-detail-row">
        <div class="os-detail-icon">👤</div>
        <div class="os-detail-text">
          <div class="os-detail-label">Cliente</div>
          <div class="os-detail-value">${esc(os.cliente_nome)}</div>
        </div>
      </div>
      <div class="os-detail-row">
        <div class="os-detail-icon">📞</div>
        <div class="os-detail-text">
          <div class="os-detail-label">Telefone</div>
          <div class="os-detail-value">${esc(os.cliente_telefone) || '—'}</div>
        </div>
      </div>
      <div class="os-detail-row">
        <div class="os-detail-icon">📍</div>
        <div class="os-detail-text">
          <div class="os-detail-label">Endereço</div>
          <div class="os-detail-value">${esc(os.endereco) || '—'}</div>
        </div>
      </div>
      ${os.ponto_referencia ? `
      <div class="os-detail-row">
        <div class="os-detail-icon">🗺️</div>
        <div class="os-detail-text">
          <div class="os-detail-label">Referência</div>
          <div class="os-detail-value">${esc(os.ponto_referencia)}</div>
        </div>
      </div>` : ''}
      <div class="os-detail-row">
        <div class="os-detail-icon">🚗</div>
        <div class="os-detail-text">
          <div class="os-detail-label">Veículo</div>
          <div class="os-detail-value">${esc(os.veiculo) || '—'}</div>
        </div>
      </div>
      <div class="os-detail-row">
        <div class="os-detail-icon">⛽</div>
        <div class="os-detail-text">
          <div class="os-detail-label">GNV</div>
          <div class="os-detail-value">${esc(os.gnv) || '—'}</div>
        </div>
      </div>
      <div class="os-detail-row">
        <div class="os-detail-icon">📡</div>
        <div class="os-detail-text">
          <div class="os-detail-label">Rastreio</div>
          <div class="os-detail-value">${esc(os.rastreio) || '—'}</div>
        </div>
      </div>

      <div class="os-actions">
        ${wppURL ? `<button class="os-btn btn-wpp" data-wpp="${wppURL}">💬 WhatsApp</button>` : ''}
        ${mapsURL ? `<button class="os-btn btn-maps" data-maps="${mapsURL}">📍 Maps</button>` : ''}
      </div>
      <button class="os-btn btn-contato${isPendente?'':' done'}" data-id="${os.id}" style="margin-top:8px">
        ${isPendente ? '📞 Marcar contato realizado' : '✅ Contato realizado'}
      </button>
      ${contatoInfo}
    </div>
  </div>`;
}

function toggleCard(id) {
  const body = document.getElementById(`body-${id}`);
  if(!body) return;
  body.classList.toggle('open');
}

function bindOSActions(container, osList) {
  container.querySelectorAll('[data-wpp]').forEach(btn => {
    btn.onclick = () => window.open(btn.dataset.wpp, '_blank');
  });
  container.querySelectorAll('[data-maps]').forEach(btn => {
    btn.onclick = () => window.open(btn.dataset.maps, '_blank');
  });
  container.querySelectorAll('.btn-contato[data-id]').forEach(btn => {
    btn.onclick = () => marcarContato(btn.dataset.id, btn);
  });
}

async function marcarContato(osId, btn) {
  const os = osList.find(o => o.id === osId);
  if (!os) return;
  if (os.status === 'contato_realizado') return;

  btn.textContent = 'Salvando...';
  btn.disabled = true;

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action: 'updateStatus',
        tecnico: session.tecnico,
        senha: session.senha,
        id: osId
      })
    });
    const data = await res.json();
    if(data.erro) throw new Error(data.erro);

    os.status = 'contato_realizado';
    const now = new Date();
    os.data_contato  = now.toLocaleDateString('pt-BR');
    os.hora_contato  = now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    showToast('Contato registrado!','ok');
    loadOS();
  } catch(err) {
    showToast('Erro: '+err.message,'fail');
    btn.textContent = '📞 Marcar contato realizado';
    btn.disabled = false;
  }
}

// ══════════════════════════════════════════════════════════
// MODAL OS MANUAL
// ══════════════════════════════════════════════════════════
function setupModal() {
  const modal = document.getElementById('modalOS');
  document.getElementById('fabAdd').onclick = () => {
    // preenche data/hora atual
    const now = new Date();
    document.getElementById('mData').value = now.toISOString().slice(0,10);
    document.getElementById('mHora').value = now.toTimeString().slice(0,5);
    modal.classList.add('open');
  };
  document.getElementById('btnCancelOS').onclick = () => modal.classList.remove('open');
  modal.addEventListener('click', e => { if(e.target===modal) modal.classList.remove('open'); });
  document.getElementById('btnSaveOS').onclick = saveOSManual;
}

async function saveOSManual() {
  const nome = document.getElementById('mNome').value.trim();
  const tel  = document.getElementById('mTel').value.trim();
  const end  = document.getElementById('mEnd').value.trim();
  const data = document.getElementById('mData').value;
  const hora = document.getElementById('mHora').value;
  const vei  = document.getElementById('mVeiculo').value.trim();

  if (!nome || !vei) { showToast('Nome e veículo são obrigatórios.','fail'); return; }

  const btn = document.getElementById('btnSaveOS');
  btn.textContent = 'Salvando...'; btn.disabled = true;

  // converte data YYYY-MM-DD para DD/MM/YYYY
  const dataFmt = data ? data.split('-').reverse().join('/') : '';

  try {
    const res = await fetch(GAS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action:'saveOS',
        tecnico: session.tecnico,
        senha: session.senha,
        os:{
          data_agendada: dataFmt,
          hora_agendada: hora,
          cliente_nome: nome,
          cliente_telefone: tel,
          endereco: end,
          ponto_referencia: document.getElementById('mRef').value.trim(),
          veiculo: vei,
          gnv: document.getElementById('mGnv').value,
          rastreio: document.getElementById('mRastreio').value,
        }
      })
    });
    const d = await res.json();
    if(d.erro) throw new Error(d.erro);
    showToast('OS salva!','ok');
    document.getElementById('modalOS').classList.remove('open');
    // limpa
    ['mNome','mTel','mEnd','mRef','mVeiculo'].forEach(id=>document.getElementById(id).value='');
    loadOS();
  } catch(err) {
    showToast('Erro: '+err.message,'fail');
  } finally {
    btn.textContent = '✅ Salvar OS'; btn.disabled = false;
  }
}

// ══════════════════════════════════════════════════════════
// SWIPE / TABS
// ══════════════════════════════════════════════════════════
function switchTab(idx) {
  currentTab = idx;
  document.getElementById('tabCal').classList.toggle('active', idx===0);
  document.getElementById('tabPainel').classList.toggle('active', idx===1);
  document.getElementById('paneCalendario').style.transform = idx===0 ? 'translateX(0)' : 'translateX(-100%)';
  document.getElementById('panePainel').style.transform = idx===0 ? 'translateX(0)' : 'translateX(-100%)';
}

function setupSwipe() {
  const wrap = document.getElementById('swipeWrap');
  let sx=0, sy=0, moved=false;
  wrap.addEventListener('touchstart', e => {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    moved = false;
  }, {passive:true});
  wrap.addEventListener('touchmove', e => { moved=true; }, {passive:true});
  wrap.addEventListener('touchend', e => {
    if(!moved) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      if(dx < 0 && currentTab===0) switchTab(1);
      if(dx > 0 && currentTab===1) switchTab(0);
    }
  }, {passive:true});
  // posição inicial
  switchTab(0);
}

// ══════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════
function esc(str) {
  return String(str||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function sanitizeTel(tel) {
  return String(tel||'').replace(/\D/g,'');
}

function parseDate(str) {
  if(!str) return new Date(0);
  const [d,m,y] = str.split('/');
  return new Date(`${y}-${m}-${d}`);
}

function showToast(msg, kind) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show'+(kind?' '+kind:'');
  setTimeout(()=>{ t.className='toast'; }, 2800);
}
</script>
