<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apreensão — máquinas</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚜</text></svg>">
<meta name="theme-color" content="#0b1016">
<style>
  :root{--bg:#0b1016;--card:#151c25;--linha:#222c38;--txt:#eef2f6;--sub:#8a97a6;--ok:#22c55e}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       padding:calc(14px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
  h1{font-size:21px;margin:4px 0 4px}
  .sub{color:var(--sub);font-size:13px;margin:0 2px 12px}
  .barra{height:12px;background:var(--card);border-radius:20px;overflow:hidden;margin:6px 0 6px}
  .barra i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
  .resumo{font-size:15px;margin:0 2px 10px}
  .resumo b{color:var(--ok)}
  .tipos{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
  .tipos div{background:var(--card);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--sub)}
  .tipos div b{color:var(--txt);font-size:15px}
  .tipos div.fim b{color:var(--ok)}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:6px;background:var(--card);border-radius:12px;border-left:5px solid transparent;user-select:none;cursor:pointer}
  li .n{flex:none;width:24px;color:var(--sub);font-size:14px;text-align:right}
  li .bx{width:28px;height:28px;border-radius:7px;border:2px solid #5b6776;flex:none;display:grid;place-items:center;font-size:17px;font-weight:800;color:#06240f}
  li .tx{flex:1;min-width:0}
  li .bem{font-size:12px;font-weight:500;color:var(--sub);text-transform:uppercase}
  li .ch{font:700 20px/1.25 ui-monospace,Menlo,Consolas,monospace;color:#fff;letter-spacing:.3px;word-break:break-all;margin-top:3px}
  li .tag{flex:none;font-size:12px;font-weight:800;padding:4px 9px;border-radius:20px;background:#14532d;color:#bbf7d0}
  li .selo{display:inline-block;background:#4ade80;color:#052e12;font-weight:900;font-size:13px;letter-spacing:.5px;padding:3px 9px;border-radius:6px;margin-bottom:3px}
  li .nm2{font-size:14px;color:#86efac;margin-top:2px}
  li{position:relative}
  li .hora{display:inline-block;margin-left:6px;font-size:13px;font-weight:800;color:#bbf7d0;background:#14532d;padding:2px 8px;border-radius:20px;vertical-align:top}
  li .ult{display:inline-block;margin-left:6px;background:#f59e0b;color:#3b1d00;font-weight:900;font-size:11px;padding:3px 7px;border-radius:6px;vertical-align:top}
  li{gap:8px;padding:10px}
  li .n{width:18px}
  li .mini{flex:none;width:58px;height:42px;object-fit:contain}
  li .bem,li .nm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  li .ch{font-size:clamp(14px,4.5vw,20px);white-space:nowrap;word-break:normal;letter-spacing:0}
  li .lin{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;margin-bottom:3px}
  li .lin .selo{margin:0;font-size:11.5px;padding:3px 7px}
  li .lin .hora{margin:0;font-size:12px;padding:2px 7px;white-space:nowrap}
  li.preso{border-left-color:var(--ok);background:#10231a}
  li.preso .bx{background:var(--ok);border-color:var(--ok)}
  li.preso .bem{text-decoration:none;color:#86efac}
  li.preso .ch{color:#86efac}
  li.conf{outline:2px solid #f59e0b}
  .busca{position:sticky;top:0;z-index:5;display:flex;gap:8px;background:var(--bg);padding:8px 0}
  .busca input{flex:1;min-width:0;padding:13px 12px;border-radius:12px;border:2px solid #3b82f6;background:var(--card);color:var(--txt);font:700 18px ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase}
  .busca input::placeholder{font:500 15px system-ui,sans-serif;text-transform:none;color:var(--sub)}
  .busca button{display:none;flex:none;width:48px;border:0;border-radius:12px;background:#2b3644;color:var(--txt);font-size:18px}
  .busca.tem button{display:block}
  ul.filtrando{min-height:100vh}
  .nada{color:var(--sub);text-align:center;padding:18px 8px;font-size:15px}
  .rede{display:none;background:#78350f;color:#fde68a;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin:0 0 8px}
  .rede.on{display:block}
  .aviso{font-size:13px;color:#f5c26b;text-align:center;margin:8px 0;min-height:1.2em}
  .pdf{display:block;width:100%;margin-top:16px;padding:15px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:16px;font-weight:700}
  .pdf:disabled{opacity:.6}
  .pdf.ok2{background:#16a34a;margin-top:10px}
  .rod{color:var(--sub);font-size:12px;text-align:center;margin-top:14px}
</style>
</head>

// nome guardado no servidor: "NN|CHASSI"
const chave = (i) => String(i + 1).padStart(2, '0') + '|' + MAQ[i][1];
const CHAVES = MAQ.map((_, i) => chave(i));
let ESTADO = { itens: [], v: -1 };
let ocupado = false, iniciando = false, ultOk = 0;
// OFFLINE: a última lista fica guardada no celular e os toques sem internet ficam numa fila (PEND = chassi → presa sim/não)
let PEND = {};
try { const e = JSON.parse(localStorage.getItem('apr_estado') || 'null'); if (e && Array.isArray(e.itens)) { ESTADO = e; ultOk = e.em || 0; } } catch (e) {}
try { PEND = JSON.parse(localStorage.getItem('apr_pend') || '{}') || {}; } catch (e) { PEND = {}; }
// fila: chassi → { q: presa sim/não, em: hora do toque }
Object.keys(PEND).forEach(k => { if (typeof PEND[k] !== 'object') PEND[k] = { q: !!PEND[k], em: Date.now() }; });
function guardarPend() { try { localStorage.setItem('apr_pend', JSON.stringify(PEND)); } catch (e) {} }
const $ = (id) => document.getElementById(id);

async function api(corpo) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ acao: 'compras', lista: LISTA }, corpo)) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erro || 'Sem conexão.');
  return j;
}
function presos() { const s = new Set(); (ESTADO.itens || []).forEach(it => { if (it.q && CHAVES.includes(it.n)) s.add(it.n); });
  Object.keys(PEND).forEach(k => { if (PEND[k].q) s.add(k); else s.delete(k); }); return s; }
// hora em que a máquina foi marcada (a do toque guardado no celular vale até enviar)
function horaDe(k) { if (PEND[k]) return PEND[k].q ? PEND[k].em : 0; const it = (ESTADO.itens || []).find(x => x.n === k); return (it && it.q && it.em) || 0; }
const hhmm = (ms) => new Date(ms).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

// 1ª abertura: deixa a lista do servidor só com as 15 máquinas (sem repetir; não desmarca nada)
async function garantirLista(j) {
  const nomes = (j.itens || []).map(x => x.n);
  const faltam = CHAVES.filter(c => !nomes.includes(c)), sobram = nomes.filter(n => !CHAVES.includes(n));
  if ((!faltam.length && !sobram.length) || iniciando) return j;
  iniciando = true;
  try {
    for (const n of sobram) j = await api({ op: 'del', nome: n });
    for (const c of faltam) j = await api({ op: 'add', nome: c });
  } finally { iniciando = false; }
  return j;
}
function aplicar(j) { if (j && Array.isArray(j.itens) && (j.v || 0) >= ESTADO.v) { ultOk = Date.now(); ESTADO = { itens: j.itens, v: j.v || 0, em: ultOk };
  try { localStorage.setItem('apr_estado', JSON.stringify(ESTADO)); } catch (e) {} render(); } }

let confirmando = -1, tConf = 0;
function render() {
  const P = presos(), L = $('lista'); L.textContent = '';
  // achadas (presas) em cima, depois as que faltam; dentro de cada grupo, pela numeração
  // as apreendidas ficam na ordem em que foram marcadas (a última marcada é a última verde)
  const H = MAQ.map((_, i) => P.has(CHAVES[i]) ? horaDe(CHAVES[i]) : 0);
  const ordem = MAQ.map((_, i) => i).sort((x, y) => (P.has(CHAVES[y]) - P.has(CHAVES[x])) || (H[x] - H[y]) || (x - y));
  let ultima = -1, hMax = 0; ordem.forEach(i => { if (P.has(CHAVES[i]) && H[i] > hMax) { hMax = H[i]; ultima = i; } });
  const f = filtro(); L.classList.toggle('filtrando', !!f); $('buscaBox').classList.toggle('tem', !!f);
  let vistos = 0;
  ordem.forEach((i, pos) => { const m = MAQ[i];
    if (f && !(m[1].includes(f) || m[0].toUpperCase().replace(/[^A-Z0-9]/g, '').includes(f))) return;
    vistos++;
    const preso = P.has(CHAVES[i]);
    const li = document.createElement('li'); if (preso) li.classList.add('preso'); if (confirmando === i) li.classList.add('conf');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = pos + 1;
    const bx = document.createElement('span'); bx.className = 'bx'; bx.textContent = preso ? '✓' : '';
    const tx = document.createElement('div'); tx.className = 'tx';
    const c = document.createElement('div'); c.className = 'ch'; c.textContent = m[1];
    if (preso) {
      const sl = document.createElement('div'); sl.className = 'selo'; sl.textContent = 'APREENDIDO';
      if (H[i]) { const hr = document.createElement('span'); hr.className = 'hora'; hr.textContent = '🕒 ' + hhmm(H[i]); sl.hr = hr; }
      const nm = document.createElement('div'); nm.className = 'nm2'; nm.textContent = frase(m[0]);
      const lin = document.createElement('div'); lin.className = 'lin'; lin.append(sl); if (sl.hr) lin.append(sl.hr); if (sl.ult) lin.append(sl.ult);
      tx.append(lin, c, nm);
    } else {
      const b = document.createElement('div'); b.className = 'bem'; b.textContent = m[0];
      tx.append(b, c);
    }
    const im = document.createElement('img'); im.className = 'mini'; im.alt = ''; im.src = FOTO[m[2]] || '';
    li.append(n, bx, im, tx);
    li.onclick = () => tocar(i);
    L.append(li);
  });
  if (f && !vistos) { const d = document.createElement('li'); d.className = 'nada'; d.style.cursor = 'default'; d.textContent = 'Nenhum chassi da lista tem "' + f + '". Confira o que digitou.'; L.append(d); }
  const tot = MAQ.length, np = P.size;
  $('barra').style.width = (np / tot * 100) + '%';
  $('resumo').innerHTML = np === tot ? '🎉 <b>Todas as ' + tot + ' apreendidas!</b>' : '<b>' + np + ' de ' + tot + '</b> · faltam ' + (tot - np);
  const tipos = {}; MAQ.forEach((m, i) => { const t = tipos[m[2]] || (tipos[m[2]] = { tot: 0, p: 0 }); t.tot++; if (P.has(CHAVES[i])) t.p++; });
  $('tipos').innerHTML = Object.keys(tipos).map(k => '<div class="' + (tipos[k].p === tipos[k].tot ? 'fim' : '') + '">' + k + '<br><b>' + tipos[k].p + ' / ' + tipos[k].tot + '</b></div>').join('');
}
function filtro() { return $('busca').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); }
// a busca sobe para o topo da tela: os resultados ficam logo abaixo dela, acima do teclado
function buscaTopo() { try { $('buscaBox').scrollIntoView({ block: 'start' }); } catch (e) {} }
function frase(t) {
  const fixo = { case: 'Case', af: 'AF', sp: 'SP', terraflex: 'Terraflex' };
  const r = t.toLowerCase().split(' ').map(w => fixo[w] || w.replace(/^terraflex(.*)$/, (x, r) => 'Terraflex' + r.toUpperCase())).join(' ');
  return r.charAt(0).toUpperCase() + r.slice(1);
}
function aviso(t) { $('aviso').textContent = t || ''; }

// manda a fila: para cada máquina, confere no servidor e só toca se estiver diferente do que a pessoa marcou
async function sincronizar() {
  if (ocupado || iniciando || !Object.keys(PEND).length) { estadoRede(); return; }
  ocupado = true;
  try {
    let j = await api({}); j = await garantirLista(j);
    for (const k of Object.keys(PEND)) {
      const quer = PEND[k].q, em = PEND[k].em;
      for (let t = 0; t < 2; t++) {
        const it = (j.itens || []).find(x => x.n === k);
        if (!it || !!it.q === quer) break;
        j = await api({ op: 'marcar', nome: k, quem: 'eu', em });
      }
      const it = (j.itens || []).find(x => x.n === k);
      if (it && !!it.q === quer) { delete PEND[k]; guardarPend(); }
    }
    aplicar(j); aviso(Object.keys(PEND).length ? '' : '✓ salvo para todos');
  } catch (e) { /* sem internet: fica guardado e tenta de novo */ }
  ocupado = false; estadoRede();
}
function estadoRede() {
  const n = Object.keys(PEND).length, off = navigator.onLine === false || (Date.now() - ultOk > 12000 && ultOk > 0);
  const el = $('rede');
  if (n) { el.className = 'rede on'; el.textContent = '📴 ' + (n === 1 ? '1 marcação guardada' : n + ' marcações guardadas') + ' no celular. Vão para todos assim que a internet voltar.'; }
  else if (off) { el.className = 'rede on'; el.textContent = '📴 Sem internet. Pode marcar normalmente: fica guardado e envia sozinho quando voltar.'; }
  else { el.className = 'rede'; el.textContent = ''; }
}
function tocar(i) {
  const k = CHAVES[i], preso = presos().has(k);
  if (preso) {                       // desmarcar pede um segundo toque
    if (confirmando !== i || Date.now() - tConf > 4000) { confirmando = i; tConf = Date.now(); aviso('Toque de novo para DESMARCAR o chassi ' + MAQ[i][1] + '.'); render(); return; }
  }
  confirmando = -1; PEND[k] = { q: !preso, em: Date.now() }; guardarPend();
  if (filtro()) { $('busca').value = ''; $('busca').blur(); }
  aviso(navigator.onLine === false ? 'Guardado no celular. Envia quando a internet voltar.' : 'Enviando…');
  render(); estadoRede(); sincronizar();
}

async function atualizar(forcar) {
  if ((ocupado || iniciando || document.hidden) && !forcar) return;
  if (Object.keys(PEND).length) { sincronizar(); return; }
  try { let j = await api({}); j = await garantirLista(j); aplicar(j); }
  catch (e) { /* sem internet: mostra a última lista guardada */ }
  estadoRede();
}
setInterval(() => { const s = ultOk ? Math.round((Date.now() - ultOk) / 1000) : null;
  $('rod').textContent = s == null ? '' : 'Atualiza sozinho a cada 3 s · última atualização há ' + (s < 120 ? s + ' s' : Math.round(s / 60) + ' min'); estadoRede(); }, 1000);
window.addEventListener('online', () => { aviso(''); atualizar(true); });
window.addEventListener('offline', estadoRede);
// guarda a página no celular para abrir mesmo sem internet
if ('serviceWorker' in navigator) navigator.serviceWorker.register('apreensao-sw.js', { scope: './apreensao' }).catch(() => {});
// PDF das que faltam (gerado no próprio celular)
function carregarJsPdf() {
  if (window.jspdf) return Promise.resolve();
  return new Promise((ok, erro) => { const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    sc.onload = ok; sc.onerror = () => erro(new Error('não carregou')); document.head.append(sc); });
}
async function gerarPdf(achadas) {
  const P = presos(), falta = MAQ.map((m, i) => i).filter(i => achadas ? P.has(CHAVES[i]) : !P.has(CHAVES[i]));
  if (!falta.length) { aviso(achadas ? 'Nenhuma máquina apreendida ainda.' : 'Todas foram apreendidas. Não há o que pôr no PDF.'); return; }
  const bt = $(achadas ? 'bPdfOk' : 'bPdf'), txt = bt.textContent; bt.disabled = true; bt.textContent = 'Gerando o PDF…';
  try {
    await carregarJsPdf();
    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    const agora = new Date(), dh = agora.toLocaleDateString('pt-BR') + ' às ' + agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    let y = 18;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text(achadas ? 'Máquinas ENCONTRADAS (apreendidas)' : 'Máquinas NÃO encontradas', 15, y); y += 7;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(90);
    doc.text('Situação em ' + dh + ' · ' + (achadas ? falta.length + ' de ' + MAQ.length + ' apreendidas · ' + (MAQ.length - falta.length) + ' faltando' : falta.length + ' de ' + MAQ.length + ' faltando · ' + (MAQ.length - falta.length) + ' apreendidas'), 15, y); y += 9;
    doc.setTextColor(0); doc.setFillColor(230, 230, 230); doc.rect(15, y - 5, 180, 8, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
    doc.text('Nº', 18, y); doc.text('CHASSI', 30, y); doc.text('BEM', 92, y); if (achadas) doc.text('HORA', 178, y); y += 8;
    if (achadas) falta.sort((a, b) => (horaDe(CHAVES[a]) - horaDe(CHAVES[b])) || (a - b));
    falta.forEach((i, k) => {
      if (y > 280) { doc.addPage(); y = 18; }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text(String(k + 1), 18, y); doc.text(MAQ[i][1], 30, y);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.text(MAQ[i][0], 92, y);
      if (achadas && horaDe(CHAVES[i])) doc.text(hhmm(horaDe(CHAVES[i])), 178, y);
      doc.setDrawColor(210); doc.line(15, y + 3, 195, y + 3); y += 9;
    });
    const nome = (achadas ? 'maquinas-encontradas-' : 'maquinas-nao-encontradas-') + agora.toISOString().slice(0, 16).replace(/[-:T]/g, '') + '.pdf';
    const blob = doc.output('blob'), arq = new File([blob], nome, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [arq] })) {
      try { await navigator.share({ files: [arq], title: achadas ? 'Máquinas encontradas' : 'Máquinas não encontradas' }); aviso('PDF pronto.'); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    doc.save(nome); aviso('PDF baixado.');
  } catch (e) { aviso('Não consegui gerar o PDF (' + e.message + '). Tente de novo.'); }
  finally { bt.disabled = false; bt.textContent = txt; }
}
$('busca').addEventListener('input', () => { confirmando = -1; render(); buscaTopo(); });
$('busca').addEventListener('focus', () => { setTimeout(buscaTopo, 50); setTimeout(buscaTopo, 400); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { if (document.activeElement === $('busca')) buscaTopo(); });
$('buscaX').onclick = () => { $('busca').value = ''; render(); $('busca').focus(); };
$('bPdf').onclick = () => gerarPdf(false);
$('bPdfOk').onclick = () => gerarPdf(true);
render(); estadoRede(); atualizar(); setInterval(atualizar, 3000);
document.addEventListener('visibilitychange', () => atualizar());
</script>
