<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rastreando GPS — Admin</title>
<meta name="theme-color" content="#0a0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0a0e14;--bg-card:#141a24;--bg-card2:#1a212d;
  --cyan:#00e5ff;--text:#e8eaed;--text-dim:#8b96a5;--text-muted:#4a5568;
  --green:#00c853;--yellow:#ffb300;--red:#e8002d;--blue:#1e88e5;
  --border:#232c38;--border2:#2d3748;--pending:#ffb300;--done:#1e88e5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}

/* ── LOGIN ── */
#loginScreen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;
}
.login-box{width:100%;max-width:340px}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo h1{font-size:22px;font-weight:800}
.login-logo h1 span{color:var(--cyan)}
.login-logo p{color:var(--text-dim);font-size:13px;margin-top:6px}
.lfield{margin-bottom:14px}
.lfield label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.lfield input{width:100%;background:var(--bg-card);border:1px solid var(--border2);color:var(--text);padding:14px 16px;border-radius:12px;font-size:16px;outline:none;}
.lfield input:focus{border-color:var(--cyan)}
.btn-login{width:100%;background:var(--cyan);color:#04222a;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px;}
#loginErr{color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:18px}

/* ── APP LAYOUT ── */
#app{display:none;height:100%;flex-direction:column}
#app.visible{display:flex}

.topbar{
  padding:12px 16px 10px;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid var(--border);
  flex-shrink:0;background:var(--bg);
}
.topbar h1{font-size:16px;font-weight:800}
.topbar h1 span{color:var(--cyan)}
.topbar p{font-size:11px;color:var(--text-dim);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:10px}
.sync-dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);transition:background .3s,box-shadow .3s;}
.sync-dot.syncing{background:var(--yellow);box-shadow:0 0 6px var(--yellow);animation:pulse 1s infinite}
.sync-dot.error{background:var(--red);box-shadow:0 0 6px var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn-logout{font-size:11px;color:var(--text-dim);cursor:pointer;background:var(--bg-card);border:1px solid var(--border2);padding:4px 10px;border-radius:8px;}

.tabnav{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);}
.tabnav button{flex:1;padding:11px 4px;background:none;border:none;color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;}
.tabnav button.active{color:var(--cyan);border-bottom-color:var(--cyan)}

.swipe-wrap{flex:1;display:flex;overflow:hidden;position:relative}
.swipe-pane{min-width:100%;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;transition:transform .28s cubic-bezier(.4,0,.2,1);}

/* ── IMPORTAR ── */
.import-wrap{padding:16px;max-width:540px;margin:0 auto}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
.card-title{font-size:14px;font-weight:700;color:var(--cyan);margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{width:100%;background:var(--bg-card2);border:1px solid var(--border2);color:var(--text);padding:12px 14px;border-radius:10px;font-size:14px;outline:none;transition:border-color .2s;font-family:inherit;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan)}
.field textarea{resize:vertical;min-height:110px;line-height:1.5}
.field select option{background:var(--bg-card)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-primary{width:100%;background:var(--cyan);color:#04222a;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;transition:opacity .15s,transform .15s;margin-top:4px;}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:default}
.btn-secondary{width:100%;background:var(--bg-card);color:var(--text-dim);border:1px solid var(--border2);border-radius:12px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;}
.tec-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.tec-pill{padding:7px 16px;border-radius:20px;border:1px solid var(--border2);background:var(--bg-card2);color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.tec-pill.active{background:var(--cyan);color:#04222a;border-color:var(--cyan)}
.preview-block{background:var(--bg-card2);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.preview-row{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px;}
.preview-row:last-child{border-bottom:none}
.preview-label{color:var(--text-dim);min-width:95px;flex-shrink:0;font-size:12px}
.preview-value{color:var(--text);word-break:break-word}
.veiculo-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.vtab{padding:5px 12px;border-radius:16px;border:1px solid var(--border2);background:var(--bg-card2);color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.vtab.active{background:var(--yellow);color:#1a1a00;border-color:var(--yellow)}
.info-box{background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.2);border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:12px;color:var(--cyan);}

/* ── PAINEL ADMIN ── */
.painel-wrap{padding:12px 16px;max-width:540px;margin:0 auto}

/* filtros */
.painel-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--bg-card);color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.filter-btn.active{background:var(--cyan);color:#04222a;border-color:var(--cyan)}
.filter-sep{width:1px;height:20px;background:var(--border2);margin:0 2px}

/* resumo */
.resumo-bar{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;
}
.resumo-card{
  background:var(--bg-card);border:1px solid var(--border2);
  border-radius:12px;padding:10px;text-align:center;
}
.resumo-num{font-size:22px;font-weight:800;line-height:1}
.resumo-label{font-size:10px;color:var(--text-dim);margin-top:4px;text-transform:uppercase;letter-spacing:.4px}
.resumo-total .resumo-num{color:var(--cyan)}
.resumo-pend .resumo-num{color:var(--pending)}
.resumo-feito .resumo-num{color:var(--done)}

/* OS card (painel admin — expandível) */
.os-card{background:var(--bg-card);border:1px solid var(--border2);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.os-card.status-pendente{border-left:4px solid var(--pending)}
.os-card.status-feito{border-left:4px solid var(--done)}
.os-card-header{padding:12px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.os-card-title{flex:1;min-width:0}
.os-nome{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.os-meta{font-size:11px;color:var(--text-dim);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.os-tec-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px;background:rgba(0,229,255,.12);color:var(--cyan);white-space:nowrap;flex-shrink:0;}
.os-status-badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;text-transform:uppercase;letter-spacing:.4px;}
.badge-pendente{background:rgba(255,179,0,.15);color:var(--pending)}
.badge-feito{background:rgba(30,136,229,.15);color:var(--done)}
.os-card-body{padding:0 14px;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s;}
.os-card-body.open{max-height:400px;padding:0 14px 14px}
.os-detail-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);}
.os-detail-row:last-child{border-bottom:none}
.os-detail-icon{font-size:14px;flex-shrink:0;width:20px;text-align:center;margin-top:1px}
.os-detail-text{flex:1;min-width:0}
.os-detail-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px}
.os-detail-value{font-size:13px;color:var(--text);margin-top:1px;word-break:break-word}
.contato-info{font-size:11px;color:var(--text-dim);margin-top:8px;text-align:center;}

.tec-group-header{
  font-size:12px;font-weight:700;color:var(--cyan);
  padding:8px 4px 6px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--border);margin-bottom:8px;
}
.tec-count{font-size:10px;color:var(--text-dim);font-weight:600;background:var(--bg-card);border:1px solid var(--border2);border-radius:10px;padding:2px 8px;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);font-size:14px;}

/* ── MODAL EDITAR OS ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:200;padding:0;}
.modal-bg.open{display:flex}
.modal-sheet{background:var(--bg-card);border-radius:20px 20px 0 0;width:100%;max-width:540px;padding:20px 20px 36px;max-height:90vh;overflow-y:auto;}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px;}
.modal-title{font-size:15px;font-weight:800;margin-bottom:14px;color:var(--cyan)}
.btn-edit{
  background:rgba(0,229,255,.1);color:var(--cyan);
  border:1px solid rgba(0,229,255,.25);border-radius:8px;
  font-size:11px;font-weight:700;padding:5px 10px;cursor:pointer;
  white-space:nowrap;transition:opacity .15s;
}
.btn-edit:active{opacity:.7}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-card2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:300;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--green)}
.toast.fail{border-color:var(--red)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <h1>Rastreando <span>GPS</span></h1>
      <p>Painel Administrativo</p>
    </div>
    <div class="lfield">
      <label>Senha</label>
      <input type="password" id="loginPass" placeholder="••••••" inputmode="numeric">
    </div>
    <button class="btn-login" id="btnLogin">Entrar</button>
    <div id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div>
      <h1>Admin <span>Rastreando</span></h1>
      <p id="topbarSub">Painel Administrativo</p>
    </div>
    <div class="topbar-right">
      <div class="sync-dot" id="syncDot"></div>
      <div class="btn-logout" id="btnLogout">Sair</div>
    </div>
  </div>

  <div class="tabnav">
    <button class="active" id="tabImport" onclick="switchTab(0)">📲 Importar</button>
    <button id="tabPainel" onclick="switchTab(1)">📋 Painel</button>
  </div>

  <div class="swipe-wrap" id="swipeWrap">

    <!-- PANE 0: IMPORTAR -->
    <div class="swipe-pane" id="paneImport">
      <div class="import-wrap">
        <div class="card">
          <div class="card-title">📲 Importar mensagem do cliente</div>
          <div class="field">
            <label>Cole a mensagem do WhatsApp</label>
            <textarea id="msgInput" placeholder="Olá! Acabei de agendar a instalação..."></textarea>
          </div>
          <button class="btn-primary" id="btnParse" style="margin-bottom:12px">🔍 Analisar mensagem</button>

          <div id="parseResult" style="display:none">
            <div class="info-box" id="parseInfo"></div>
            <div id="veiculoTabs" style="display:none">
              <div class="field"><label>Selecione o veículo</label></div>
              <div class="veiculo-tabs" id="veiculoTabsRow"></div>
            </div>
            <div class="preview-block" id="previewBlock"></div>
            <div class="row2">
              <div class="field">
                <label>Data do agendamento</label>
                <input type="date" id="pData">
              </div>
              <div class="field">
                <label>Hora</label>
                <input type="time" id="pHora">
              </div>
            </div>
            <div class="field">
              <label>Técnico responsável</label>
              <div class="tec-pills" id="tecPills"></div>
            </div>
            <button class="btn-primary" id="btnEnviar">✅ Enviar para o técnico</button>
            <button class="btn-secondary" id="btnLimpar">Limpar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- PANE 1: PAINEL -->
    <div class="swipe-pane" id="panePainel">
      <div class="painel-wrap">

        <!-- resumo -->
        <div class="resumo-bar">
          <div class="resumo-card resumo-total">
            <div class="resumo-num" id="resumoTotal">0</div>
            <div class="resumo-label">Total OS</div>
          </div>
          <div class="resumo-card resumo-pend">
            <div class="resumo-num" id="resumoPend">0</div>
            <div class="resumo-label">Pendentes</div>
          </div>
          <div class="resumo-card resumo-feito">
            <div class="resumo-num" id="resumoFeito">0</div>
            <div class="resumo-label">Feitos</div>
          </div>
        </div>

        <!-- filtros -->
        <div class="painel-filters">
          <button class="filter-btn active" onclick="setFiltroStatus('todos',this)">Todos</button>
          <button class="filter-btn" onclick="setFiltroStatus('pendente',this)">⏳ Pendentes</button>
          <button class="filter-btn" onclick="setFiltroStatus('contato_realizado',this)">✅ Feitos</button>
          <div class="filter-sep"></div>
          <button class="filter-btn active" id="filtroTecBtn" onclick="ciclarFiltroTec(this)">👤 Todos técnicos</button>
        </div>

        <div id="painelAdminLista"></div>
      </div>
    </div>

  </div><!-- /swipe-wrap -->
</div><!-- /app -->

<!-- MODAL EDITAR OS -->
<div class="modal-bg" id="modalEditar">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">✏️ Editar Ordem de Serviço</div>
    <input type="hidden" id="editId">
    <input type="hidden" id="editTec">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
      <div class="field">
        <label>Data</label>
        <input type="date" id="editData">
      </div>
      <div class="field">
        <label>Hora</label>
        <input type="time" id="editHora">
      </div>
    </div>
    <div class="field">
      <label>Nome do cliente</label>
      <input type="text" id="editNome" autocapitalize="words">
    </div>
    <div class="field">
      <label>Telefone / WhatsApp</label>
      <input type="tel" id="editTel">
    </div>
    <div class="field">
      <label>Endereço</label>
      <input type="text" id="editEnd">
    </div>
    <div class="field">
      <label>Ponto de referência</label>
      <input type="text" id="editRef">
    </div>
    <div class="field">
      <label>Veículo (modelo e ano)</label>
      <input type="text" id="editVeiculo">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
      <div class="field">
        <label>GNV</label>
        <select id="editGnv">
          <option value="Não">Não</option>
          <option value="Sim">Sim</option>
        </select>
      </div>
      <div class="field">
        <label>Rastreio</label>
        <select id="editRastreio">
          <option value="Com bloqueio">Com bloqueio</option>
          <option value="Sem bloqueio">Sem bloqueio</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Técnico responsável</label>
      <div class="tec-pills" id="editTecPills"></div>
    </div>
    <button class="btn-primary" id="btnSalvarEdit" style="margin-top:4px">💾 Salvar alterações</button>
    <button class="btn-secondary" id="btnCancelarEdit">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxKxJ1uwA4iOLbr_6oswVUYeE2vGDD-nGRPJ4KhcvDj3GeqCE8nlhgBsuzhpAoEoYI/exec';
const ADMIN_SENHA = '271659';
const POLL_MS = 30000;

let tecnicos = [];
let allOS = {};
let parsedData = null;
let selectedVeiculoIdx = 0;
let selectedTecnico = '';
let pollTimer = null;
let currentTab = 0;
let filtroStatus = 'todos';
let filtroTecIdx = -1; // -1 = todos

// ══ INIT ══
(function init() {
  if(localStorage.getItem('rg_admin_auth') === ADMIN_SENHA) startApp();
  document.getElementById('btnLogin').onclick = doLogin;
  document.getElementById('loginPass').onkeydown = e => { if(e.key==='Enter') doLogin(); };
  document.getElementById('btnLogout').onclick = doLogout;
  document.getElementById('btnParse').onclick = parseMsg;
  document.getElementById('btnEnviar').onclick = enviarOS;
  document.getElementById('btnLimpar').onclick = limpar;
  document.getElementById('btnSalvarEdit').onclick = salvarEdicao;
  document.getElementById('btnCancelarEdit').onclick = () => document.getElementById('modalEditar').classList.remove('open');
  document.getElementById('modalEditar').addEventListener('click', e => { if(e.target===document.getElementById('modalEditar')) document.getElementById('modalEditar').classList.remove('open'); });
  setupSwipe();
})();

// ══ AUTH ══
function doLogin() {
  const senha = document.getElementById('loginPass').value.trim();
  if(senha !== ADMIN_SENHA) { document.getElementById('loginErr').textContent='Senha incorreta.'; return; }
  localStorage.setItem('rg_admin_auth', senha);
  startApp();
}
function doLogout() {
  localStorage.removeItem('rg_admin_auth');
  clearInterval(pollTimer);
  document.getElementById('app').classList.remove('visible');
  document.getElementById('loginScreen').style.display='flex';
}
function startApp() {
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').classList.add('visible');
  carregarTecnicos();
  carregarTodasOS();
  clearInterval(pollTimer);
  pollTimer = setInterval(carregarTodasOS, POLL_MS);
}

// ══ SYNC ══
function setSyncStatus(st) {
  const d = document.getElementById('syncDot');
  d.className = 'sync-dot'+(st==='syncing'?' syncing':st==='error'?' error':'');
}

async function carregarTecnicos() {
  try {
    const res = await fetch(`${GAS_URL}?action=getTecnicos&senha=${ADMIN_SENHA}`);
    const data = await res.json();
    tecnicos = data.tecnicos || [];
  } catch(e) {
    tecnicos = ['Glauber','Eberson','Jonas'];
  }
  renderTecPills();
}

async function carregarTodasOS() {
  if(!tecnicos.length) return;
  setSyncStatus('syncing');
  try {
    const results = await Promise.all(tecnicos.map(tec =>
      fetch(`${GAS_URL}?action=getOS&tecnico=${encodeURIComponent(tec)}&senha=${ADMIN_SENHA}`)
        .then(r=>r.json()).then(d=>({tec, os:d.os||[]})).catch(()=>({tec,os:[]}))
    ));
    allOS = {};
    results.forEach(r => { allOS[r.tec] = r.os; });
    renderPainelAdmin();
    setSyncStatus('ok');
  } catch(e) { setSyncStatus('error'); }
}

// ══ TABS / SWIPE ══
function switchTab(idx) {
  currentTab = idx;
  document.getElementById('tabImport').classList.toggle('active', idx===0);
  document.getElementById('tabPainel').classList.toggle('active', idx===1);
  document.getElementById('paneImport').style.transform  = idx===0 ? 'translateX(0)' : 'translateX(-100%)';
  document.getElementById('panePainel').style.transform  = idx===0 ? 'translateX(0)' : 'translateX(-100%)';
  if(idx===1) renderPainelAdmin();
}
function setupSwipe() {
  const wrap = document.getElementById('swipeWrap');
  let sx=0,sy=0,moved=false;
  wrap.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false;},{passive:true});
  wrap.addEventListener('touchmove',()=>{moved=true;},{passive:true});
  wrap.addEventListener('touchend',e=>{
    if(!moved) return;
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50){
      if(dx<0&&currentTab===0) switchTab(1);
      if(dx>0&&currentTab===1) switchTab(0);
    }
  },{passive:true});
  switchTab(0);
}

// ══ PARSER ══
function parseMsg() {
  const raw = document.getElementById('msgInput').value.trim();
  if(!raw){ showToast('Cole a mensagem primeiro.','fail'); return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const get = p => { const l=lines.find(l=>l.toLowerCase().startsWith(p.toLowerCase())); return l?l.slice(p.length).trim():''; };
  const nome=get('Nome:'), telefone=get('Telefone:'), endereco=get('Endereço:');
  const refLine=get('Ponto de referência:'), pedidoId=get('ID do pedido:');
  const veiculos=[];
  lines.forEach(line=>{
    const m=line.match(/^Veículo\s*\d+:\s*(.+)$/i);
    if(!m) return;
    const infoM=line.match(/GNV:\s*(Sim|Não)\s*\|\s*Rastreio:\s*(.+)/i);
    let gnv='',rastreio='';
    if(infoM){gnv=infoM[1];rastreio=infoM[2].trim();}
    else{
      const vi=lines.indexOf(line);
      for(let i=vi+1;i<Math.min(vi+4,lines.length);i++){
        const il=lines[i].match(/GNV:\s*(Sim|Não)\s*\|\s*Rastreio:\s*(.+)/i);
        if(il){gnv=il[1];rastreio=il[2].trim();break;}
      }
    }
    veiculos.push({veiculo:m[1].trim().split(/\s*GNV:/)[0].trim(),gnv:gnv||'Não',rastreio:rastreio||'Sem bloqueio'});
  });
  if(!veiculos.length){showToast('Não encontrei veículos na mensagem.','fail');return;}
  parsedData={nome,telefone,endereco,ponto_referencia:refLine,pedido_id:pedidoId,veiculos};
  selectedVeiculoIdx=0;
  renderParseResult();
}

function renderParseResult() {
  document.getElementById('parseResult').style.display='block';
  document.getElementById('parseInfo').textContent=`✅ ${parsedData.veiculos.length} veículo(s) para ${parsedData.nome||'—'}`;
  if(parsedData.veiculos.length>1){
    document.getElementById('veiculoTabs').style.display='block';
    document.getElementById('veiculoTabsRow').innerHTML=parsedData.veiculos.map((v,i)=>
      `<div class="vtab${i===selectedVeiculoIdx?' active':''}" onclick="selectVeiculo(${i})">Veículo ${i+1}</div>`).join('');
  } else {
    document.getElementById('veiculoTabs').style.display='none';
  }
  renderPreview();
}

function selectVeiculo(idx) {
  selectedVeiculoIdx=idx;
  document.querySelectorAll('.vtab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  renderPreview();
}

function renderPreview() {
  if(!parsedData) return;
  const vei=parsedData.veiculos[selectedVeiculoIdx];
  const rows=[
    ['👤 Nome',parsedData.nome],['📞 Telefone',parsedData.telefone],
    ['📍 Endereço',parsedData.endereco],['🗺️ Referência',parsedData.ponto_referencia],
    ['🚗 Veículo',vei.veiculo],['⛽ GNV',vei.gnv],['📡 Rastreio',vei.rastreio],['🆔 Pedido',parsedData.pedido_id],
  ].filter(r=>r[1]);
  document.getElementById('previewBlock').innerHTML=rows.map(([l,v])=>
    `<div class="preview-row"><div class="preview-label">${l}</div><div class="preview-value">${esc(v)}</div></div>`).join('');
  if(!document.getElementById('pData').value){
    const now=new Date();
    document.getElementById('pData').value=now.toISOString().slice(0,10);
    document.getElementById('pHora').value=now.toTimeString().slice(0,5);
  }
}

function renderTecPills() {
  document.getElementById('tecPills').innerHTML=tecnicos.map(t=>
    `<div class="tec-pill${t===selectedTecnico?' active':''}" onclick="selectTecnico('${t}')">${t}</div>`).join('');
}
function selectTecnico(nome) {
  selectedTecnico=nome;
  document.querySelectorAll('.tec-pill').forEach(p=>p.classList.toggle('active',p.textContent===nome));
}

async function enviarOS() {
  if(!parsedData){showToast('Analise uma mensagem primeiro.','fail');return;}
  if(!selectedTecnico){showToast('Selecione um técnico.','fail');return;}
  const vei=parsedData.veiculos[selectedVeiculoIdx];
  const data=document.getElementById('pData').value;
  const hora=document.getElementById('pHora').value;
  const dataFmt=data?data.split('-').reverse().join('/'):'';
  const btn=document.getElementById('btnEnviar');
  btn.textContent='Enviando...'; btn.disabled=true;
  try {
    const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'saveOS',tecnico:selectedTecnico,senha:ADMIN_SENHA,
        os:{data_agendada:dataFmt,hora_agendada:hora,cliente_nome:parsedData.nome,
          cliente_telefone:parsedData.telefone,endereco:parsedData.endereco,
          ponto_referencia:parsedData.ponto_referencia,veiculo:vei.veiculo,
          gnv:vei.gnv,rastreio:vei.rastreio,pedido_id:parsedData.pedido_id}})});
    const d=await res.json();
    if(d.erro) throw new Error(d.erro);
    showToast(`✅ OS enviada para ${selectedTecnico}!`,'ok');
    if(parsedData.veiculos.length>1){
      const next=parsedData.veiculos.findIndex((_,i)=>i!==selectedVeiculoIdx);
      if(next>=0) selectVeiculo(next);
    } else { limpar(); }
    carregarTodasOS();
  } catch(err){ showToast('Erro: '+err.message,'fail'); }
  finally { btn.textContent='✅ Enviar para o técnico'; btn.disabled=false; }
}

function limpar() {
  parsedData=null; selectedVeiculoIdx=0;
  document.getElementById('msgInput').value='';
  document.getElementById('parseResult').style.display='none';
  document.getElementById('pData').value='';
  document.getElementById('pHora').value='';
}

// ══ PAINEL ADMIN ══
function setFiltroStatus(f, btn) {
  filtroStatus=f;
  document.querySelectorAll('.painel-filters .filter-btn').forEach(b=>{
    if(['todos','pendente','contato_realizado'].includes(b.textContent.replace(/[^a-záéíóúã\s]/gi,'').trim().toLowerCase().replace('todos','todos').replace('pendentes','pendente').replace('feitos','contato_realizado')) ||
       b===btn) b.classList.remove('active');
  });
  btn.classList.add('active');
  renderPainelAdmin();
}

function ciclarFiltroTec(btn) {
  // cicla: todos → Glauber → Eberson → Jonas → todos...
  filtroTecIdx = (filtroTecIdx + 1) % (tecnicos.length + 1);
  if(filtroTecIdx >= tecnicos.length) filtroTecIdx = -1;
  btn.textContent = filtroTecIdx === -1 ? '👤 Todos técnicos' : '👤 ' + tecnicos[filtroTecIdx];
  renderPainelAdmin();
}

function renderPainelAdmin() {
  // monta lista flat com tecnico
  let flat = [];
  tecnicos.forEach(tec => {
    (allOS[tec]||[]).forEach(os => flat.push({...os, _tec: tec}));
  });

  // filtros
  if(filtroStatus !== 'todos') flat = flat.filter(o => o.status === filtroStatus);
  if(filtroTecIdx >= 0) flat = flat.filter(o => o._tec === tecnicos[filtroTecIdx]);

  // ordena: data desc
  flat.sort((a,b) => parseDate(b.data_agendada) - parseDate(a.data_agendada));

  // resumo (sempre do total sem filtros)
  let allFlat = [];
  tecnicos.forEach(tec => { (allOS[tec]||[]).forEach(os => allFlat.push(os)); });
  document.getElementById('resumoTotal').textContent = allFlat.length;
  document.getElementById('resumoPend').textContent  = allFlat.filter(o=>o.status!=='contato_realizado').length;
  document.getElementById('resumoFeito').textContent = allFlat.filter(o=>o.status==='contato_realizado').length;

  const container = document.getElementById('painelAdminLista');
  if(!flat.length){
    container.innerHTML='<div class="empty-state">Nenhuma OS encontrada.</div>';
    return;
  }

  // agrupa por técnico se mostrando todos
  if(filtroTecIdx === -1) {
    let html = '';
    tecnicos.forEach(tec => {
      const group = flat.filter(o => o._tec === tec);
      if(!group.length) return;
      const pend = group.filter(o=>o.status!=='contato_realizado').length;
      html += `<div class="tec-group-header">👤 ${esc(tec)}<span class="tec-count">${group.length} OS · ${pend} pendente${pend!==1?'s':''}</span></div>`;
      html += group.map(o => osCardAdminHTML(o)).join('');
    });
    container.innerHTML = html;
  } else {
    container.innerHTML = flat.map(o => osCardAdminHTML(o)).join('');
  }

  // bind toggles
  container.querySelectorAll('.os-card-header[data-id]').forEach(h => {
    h.onclick = () => toggleCardAdmin(h.dataset.id);
  });
}

function osCardAdminHTML(os) {
  const isPend = os.status !== 'contato_realizado';
  const statusCls = isPend ? 'status-pendente' : 'status-feito';
  const badgeCls  = isPend ? 'badge-pendente'  : 'badge-feito';
  const badgeTxt  = isPend ? '⏳ Pendente'     : '✅ Feito';
  const contatoInfo = os.data_contato
    ? `<div class="contato-info">Contato: ${os.data_contato} às ${os.hora_contato}</div>` : '';

  return `
  <div class="os-card ${statusCls}" id="adm-card-${os.id}">
    <div class="os-card-header" data-id="${os.id}">
      <div class="os-card-title">
        <div class="os-nome">${esc(os.cliente_nome)||'Sem nome'}</div>
        <div class="os-meta">
          <span>📅 ${os.data_agendada||'—'}${os.hora_agendada?' às '+os.hora_agendada:''}</span>
          <span>🚗 ${esc(os.veiculo)||'—'}</span>
          <span>📍 ${esc(os.endereco)||'—'}</span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
        <div style="display:flex;gap:5px;align-items:center">
          <button class="btn-edit" data-edit-id="${os.id}" data-edit-tec="${os._tec}" onclick="abrirEditar(event,'${os.id}','${os._tec}')">✏️ Editar</button>
          <div class="os-tec-badge">${esc(os._tec)}</div>
        </div>
        <div class="os-status-badge ${badgeCls}">${badgeTxt}</div>
      </div>
    </div>
    <div class="os-card-body" id="adm-body-${os.id}">
      ${detailRow('👤','Cliente',os.cliente_nome)}
      ${detailRow('📞','Telefone',os.cliente_telefone)}
      ${detailRow('📍','Endereço',os.endereco)}
      ${os.ponto_referencia?detailRow('🗺️','Referência',os.ponto_referencia):''}
      ${detailRow('🚗','Veículo',os.veiculo)}
      ${detailRow('⛽','GNV',os.gnv)}
      ${detailRow('📡','Rastreio',os.rastreio)}
      ${os.pedido_id?detailRow('🆔','Pedido',os.pedido_id):''}
      ${contatoInfo}
    </div>
  </div>`;
}

function detailRow(icon, label, value) {
  return `<div class="os-detail-row">
    <div class="os-detail-icon">${icon}</div>
    <div class="os-detail-text">
      <div class="os-detail-label">${label}</div>
      <div class="os-detail-value">${esc(value)||'—'}</div>
    </div>
  </div>`;
}

function toggleCardAdmin(id) {
  const body = document.getElementById('adm-body-' + id);
  if(body) body.classList.toggle('open');
}

// ══ EDITAR OS ══
function abrirEditar(e, osId, tec) {
  e.stopPropagation();
  // busca OS
  const os = (allOS[tec]||[]).find(o => o.id === osId);
  if(!os){ showToast('OS não encontrada.','fail'); return; }

  // preenche campos
  document.getElementById('editId').value     = osId;
  document.getElementById('editTec').value    = tec;
  document.getElementById('editNome').value   = os.cliente_nome || '';
  document.getElementById('editTel').value    = os.cliente_telefone || '';
  document.getElementById('editEnd').value    = os.endereco || '';
  document.getElementById('editRef').value    = os.ponto_referencia || '';
  document.getElementById('editVeiculo').value= os.veiculo || '';
  document.getElementById('editGnv').value    = os.gnv || 'Não';
  document.getElementById('editRastreio').value = os.rastreio || 'Com bloqueio';

  // data/hora
  if(os.data_agendada) {
    const [d,m,y] = os.data_agendada.split('/');
    document.getElementById('editData').value = `${y}-${m}-${d}`;
  }
  document.getElementById('editHora').value = os.hora_agendada || '';

  // pills de técnico
  renderEditTecPills(tec);

  document.getElementById('modalEditar').classList.add('open');
}

function renderEditTecPills(tecAtual) {
  document.getElementById('editTecPills').innerHTML = tecnicos.map(t =>
    `<div class="tec-pill${t===tecAtual?' active':''}" onclick="selectEditTec('${t}',this)">${t}</div>`
  ).join('');
}

function selectEditTec(nome, pill) {
  document.getElementById('editTec').value = nome;
  document.querySelectorAll('#editTecPills .tec-pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
}

async function salvarEdicao() {
  const osId   = document.getElementById('editId').value;
  const tec    = document.getElementById('editTec').value;
  const nome   = document.getElementById('editNome').value.trim();
  const veiculo= document.getElementById('editVeiculo').value.trim();
  if(!nome || !veiculo){ showToast('Nome e veículo são obrigatórios.','fail'); return; }

  const dataVal = document.getElementById('editData').value;
  const dataFmt = dataVal ? dataVal.split('-').reverse().join('/') : '';

  const btn = document.getElementById('btnSalvarEdit');
  btn.textContent = 'Salvando...'; btn.disabled = true;

  try {
    const res = await fetch(GAS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action: 'updateOS',
        tecnico: tec,
        senha: ADMIN_SENHA,
        id: osId,
        os: {
          data_agendada:     dataFmt,
          hora_agendada:     document.getElementById('editHora').value,
          cliente_nome:      nome,
          cliente_telefone:  document.getElementById('editTel').value.trim(),
          endereco:          document.getElementById('editEnd').value.trim(),
          ponto_referencia:  document.getElementById('editRef').value.trim(),
          veiculo:           veiculo,
          gnv:               document.getElementById('editGnv').value,
          rastreio:          document.getElementById('editRastreio').value,
        }
      })
    });
    const d = await res.json();
    if(d.erro) throw new Error(d.erro);
    showToast('OS atualizada!','ok');
    document.getElementById('modalEditar').classList.remove('open');
    carregarTodasOS();
  } catch(err) {
    showToast('Erro: '+err.message,'fail');
  } finally {
    btn.textContent='💾 Salvar alterações'; btn.disabled=false;
  }
}

// ══ UTILS ══
function esc(str){ return String(str||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function parseDate(str){ if(!str) return new Date(0); const [d,m,y]=str.split('/'); return new Date(`${y}-${m}-${d}`); }
function showToast(msg,kind){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(kind?' '+kind:''); setTimeout(()=>{t.className='toast';},2800); }
</script>
