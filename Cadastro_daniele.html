<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Cliente · Daniele Oliveira</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --wine:    #5C1A3A;
      --plum:    #3D0E2B;
      --violet:  #7B2458;
      --blush:   #C47FA0;
      --rose:    #E8B4CC;
      --cream:   #FDF5F8;
      --text:    #2A0A1A;
      --muted:   #8A5070;
      --border:  rgba(196,127,160,0.35);
      --glass:   rgba(255,255,255,0.06);
      --shadow:  0 8px 40px rgba(61,14,43,0.45);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, var(--plum) 0%, var(--wine) 45%, #4A1040 80%, #2D0826 100%);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* orbs decorativos */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(123,36,88,0.45), transparent 70%);
      top: -100px; right: -100px;
    }
    body::after {
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(228,100,150,0.2), transparent 70%);
      bottom: -60px; left: -60px;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: rgba(255,255,255,0.055);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 44px 36px 40px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.12);
    }

    /* topo */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }
    .crown {
      line-height: 1;
      margin-bottom: 12px;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(228,100,150,0.55));
    }
    .header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.85rem;
      font-weight: 600;
      color: var(--rose);
      letter-spacing: 0.01em;
      line-height: 1.15;
    }
    .header h1 em {
      font-style: italic;
      color: #f0c8dc;
    }
    .header p {
      margin-top: 8px;
      font-size: 0.82rem;
      color: var(--blush);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--blush), transparent);
      margin: 14px auto 0;
      border-radius: 2px;
    }

    /* campos */
    .fields { display: flex; flex-direction: column; gap: 18px; }

    .field { display: flex; flex-direction: column; gap: 6px; }

    .field-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--blush);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    label .ico { font-size: 0.9rem; }

    input {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 0.97rem;
      font-family: 'DM Sans', sans-serif;
      color: #fff;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    input::placeholder { color: rgba(228,180,204,0.45); }
    input:focus {
      border-color: var(--blush);
      background: rgba(255,255,255,0.11);
      box-shadow: 0 0 0 3px rgba(196,127,160,0.2);
    }

    /* botão */
    .btn-wrap { margin-top: 10px; }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #9B3068 0%, #6B1F4A 50%, #4E1538 100%);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(92,26,58,0.6), inset 0 1px 0 rgba(255,255,255,0.15);
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(92,26,58,0.75), inset 0 1px 0 rgba(255,255,255,0.15);
      filter: brightness(1.08);
    }
    button:active { transform: translateY(0); }
    button .btn-ico { font-size: 1.15rem; }

    /* rodapé */
    .footer {
      text-align: center;
      margin-top: 26px;
    }
    .footer p {
      font-size: 0.75rem;
      color: rgba(196,127,160,0.55);
      letter-spacing: 0.04em;
    }
    .footer span { color: var(--blush); }

    @media (max-width: 480px) {
      .card { padding: 36px 22px 32px; }
      .header h1 { font-size: 1.55rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span class="crown" style="font-size:3rem;">🏋️‍♀️</span>
      <h1>Bem-vinda ao seu<br><em>novo começo</em> ✨</h1>
      <p>Personal Trainer · Daniele Oliveira</p>
      <div class="divider"></div>
    </div>

    <div class="fields">
      <div class="field">
        <label><span class="ico">🌸</span> Nome completo</label>
        <input type="text" id="nome" placeholder="Seu nome completo" />
      </div>

      <div class="field">
        <label><span class="ico">💬</span> WhatsApp</label>
        <input type="tel" id="telefone" placeholder="(DDD) 9XXXX-XXXX" />
      </div>

      <div class="field">
        <label><span class="ico">🪪</span> CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" />
      </div>

      <div class="field">
        <label><span class="ico">📮</span> CEP <span id="cep-status" style="font-size:0.7rem;color:#E8B4CC;margin-left:4px;"></span></label>
        <input type="text" id="cep" placeholder="00000-000" maxlength="9" inputmode="numeric" />
      </div>

      <div class="field">
        <label><span class="ico">📍</span> Rua / Avenida</label>
        <input type="text" id="rua" placeholder="Preenchido pelo CEP" />
      </div>

      <div class="field-row">
        <div class="field">
          <label><span class="ico">🔢</span> Número</label>
          <input type="text" id="numero" placeholder="Ex: 123" />
        </div>
        <div class="field">
          <label><span class="ico">🏘️</span> Bairro</label>
          <input type="text" id="bairro" placeholder="Preenchido pelo CEP" />
        </div>
      </div>

      <div class="field">
        <label><span class="ico">🏙️</span> Cidade</label>
        <input type="text" id="cidade" placeholder="Preenchido pelo CEP" />
      </div>
    </div>

    <div class="btn-wrap" style="margin-top:28px;">
      <button onclick="enviar()">
        <span class="btn-ico">💪</span>
        Enviar cadastro
      </button>
    </div>

    <div class="footer">
      <p>Seus dados são enviados direto para<br><span>Daniele Oliveira · Personal Trainer</span> 🤍</p>
    </div>
  </div>

  <script>
    // máscara CPF
    document.getElementById('cpf').addEventListener('input', function () {
      let v = this.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
      else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
      else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
      this.value = v;
    });

    // máscara telefone
    document.getElementById('telefone').addEventListener('input', function () {
      let v = this.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 6) v = v.replace(/(\d{2})(\d{5})(\d{1,4})/, '($1) $2-$3');
      else if (v.length > 2) v = v.replace(/(\d{2})(\d{1,5})/, '($1) $2');
      this.value = v;
    });

    // CEP — máscara + busca automática ViaCEP
    document.getElementById('cep').addEventListener('input', async function () {
      let v = this.value.replace(/\D/g, '').slice(0, 8);
      if (v.length > 5) this.value = v.replace(/(\d{5})(\d{1,3})/, '$1-$2');
      else this.value = v;

      if (v.length === 8) {
        const status = document.getElementById('cep-status');
        status.textContent = '🔍 buscando...';
        try {
          const res  = await fetch(`https://viacep.com.br/ws/${v}/json/`);
          const data = await res.json();
          if (data.erro) {
            status.textContent = '❌ CEP não encontrado';
          } else {
            document.getElementById('rua').value    = data.logradouro || '';
            document.getElementById('bairro').value = data.bairro     || '';
            document.getElementById('cidade').value = data.localidade  || '';
            status.textContent = '✅';
            document.getElementById('numero').focus();
          }
        } catch {
          status.textContent = '❌ erro na busca';
        }
      }
    });

    function enviar() {
      const nome     = document.getElementById('nome').value.trim();
      const telefone = document.getElementById('telefone').value.trim();
      const cpf      = document.getElementById('cpf').value.trim();
      const rua      = document.getElementById('rua').value.trim();
      const numero   = document.getElementById('numero').value.trim();
      const cep      = document.getElementById('cep').value.trim();
      const bairro   = document.getElementById('bairro').value.trim();
      const cidade   = document.getElementById('cidade').value.trim();

      if (!nome || !telefone || !cpf || !rua || !numero || !bairro || !cidade) {
        alert('Por favor, preencha todos os campos antes de enviar 🌸');
        return;
      }

      const msg =
        `✨ *Novo Cadastro de Cliente* ✨\n\n` +
        `👤 *Nome:* ${nome}\n` +
        `📱 *WhatsApp:* ${telefone}\n` +
        `🪪 *CPF:* ${cpf}\n\n` +
        `📍 *Endereço:*\n` +
        `▪️ Rua: ${rua}, ${numero}\n` +
        `▪️ Bairro: ${bairro}\n` +
        `▪️ Cidade: ${cidade}` +
        (cep ? `\n▪️ CEP: ${cep}` : '') +
        `\n\n💪 Enviado pelo formulário de cadastro`;

      const tel = '5521974363039';
      const url = `https://wa.me/${tel}?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
